<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Constructor Web Visual Pro</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<style>
:root{--bg:#f3f4f6;--primary:#3b82f6;--primary-h:#2563eb;--border:#e5e7eb;--text:#1f2937;--muted:#6b7280;--sb:380px;--tb:60px}
*{box-sizing:border-box}
body{margin:0;overflow:hidden;font-family:'Inter',system-ui,sans-serif;background:var(--bg);color:var(--text);display:flex;flex-direction:column;height:100vh}
.topbar{height:var(--tb);background:#fff;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;padding:0 20px;z-index:100;box-shadow:0 1px 3px rgba(0,0,0,.05)}
.vp-btn{padding:8px 12px;border-radius:6px;color:var(--muted);cursor:pointer;border:none;background:transparent}
.vp-btn.active{background:#eff6ff;color:var(--primary)}
.workspace{display:flex;flex:1;height:calc(100vh - var(--tb));overflow:hidden}
.canvas-wrap{flex:1;overflow:auto;display:flex;justify-content:center;padding:40px;background:#e5e5f7;background-image:radial-gradient(#cbd5e1 1px,transparent 1px);background-size:20px 20px}
.canvas{background:#fff;box-shadow:0 10px 25px rgba(0,0,0,.1);position:relative;min-height:2000px;width:1200px;align-self:flex-start;transition:width .3s}
.canvas.tablet{width:768px}.canvas.mobile{width:375px}
.sidebar{width:var(--sb);background:#fff;border-left:1px solid var(--border);display:flex;flex-direction:column;z-index:100}
.tabs{display:flex;border-bottom:1px solid var(--border)}
.tab{flex:1;padding:12px 0;text-align:center;font-weight:500;font-size:13px;cursor:pointer;border-bottom:2px solid transparent;color:var(--muted);background:none;border:none}
.tab.active{border-bottom-color:var(--primary);color:var(--primary)}
.scontent{flex:1;overflow-y:auto;padding:16px}
.search-box{width:100%;padding:8px 12px;border:1px solid var(--border);border-radius:8px;font-size:13px;outline:none;margin-bottom:12px;font-family:inherit}
.search-box:focus{border-color:var(--primary);box-shadow:0 0 0 2px rgba(59,130,246,.15)}
.tool-cat{margin-bottom:14px}
.tool-cat-title{font-size:10px;font-weight:700;color:#9ca3af;text-transform:uppercase;letter-spacing:.5px;margin-bottom:6px;display:flex;align-items:center;gap:6px;cursor:pointer;user-select:none}
.tool-cat-title .arrow{transition:transform .2s;font-size:9px}
.tool-cat.collapsed .arrow{transform:rotate(-90deg)}
.tool-cat.collapsed .tool-grid{display:none}
.tool-grid{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.draggable{border:1px solid var(--border);border-radius:8px;padding:9px 10px;cursor:grab;display:flex;align-items:center;gap:8px;background:#fff;font-size:12px;user-select:none}
.draggable:hover{border-color:var(--primary);box-shadow:0 2px 5px rgba(59,130,246,.15)}
.draggable:active{cursor:grabbing}
.draggable i{color:var(--primary);font-size:13px;width:14px;text-align:center;flex-shrink:0}
.draggable span{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.elemento{position:absolute;box-sizing:border-box;cursor:move;user-select:none;word-break:break-word}
#sel-box{position:absolute;border:2px solid var(--primary);pointer-events:none;z-index:9999;display:none}
.rh{position:absolute;width:10px;height:10px;background:#fff;border:2px solid var(--primary);border-radius:50%;pointer-events:auto}
.rh-nw{top:-6px;left:-6px;cursor:nwse-resize}.rh-ne{top:-6px;right:-6px;cursor:nesw-resize}
.rh-sw{bottom:-6px;left:-6px;cursor:nesw-resize}.rh-se{bottom:-6px;right:-6px;cursor:nwse-resize}
.rh-n{top:-6px;left:calc(50% - 5px);cursor:ns-resize}.rh-s{bottom:-6px;left:calc(50% - 5px);cursor:ns-resize}
.rh-e{top:calc(50% - 5px);right:-6px;cursor:ew-resize}.rh-w{top:calc(50% - 5px);left:-6px;cursor:ew-resize}
.cg{margin-bottom:12px}
.cl{display:block;font-size:11px;font-weight:600;margin-bottom:5px;color:var(--muted);text-transform:uppercase;letter-spacing:.5px}
.ci{width:100%;padding:7px 10px;border:1px solid var(--border);border-radius:6px;font-size:13px;outline:none;font-family:inherit;background:#fff}
.ci:focus{border-color:var(--primary);box-shadow:0 0 0 2px rgba(59,130,246,.15)}
.crow{display:flex;gap:10px}
.sec-h{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.5px;color:#9ca3af;margin:16px 0 8px;padding-bottom:4px;border-bottom:1px solid var(--border)}
.sec-h:first-child{margin-top:0}
.hidden{display:none!important}
.btn-p{background:#3b82f6;color:#fff;border:none;padding:8px 16px;border-radius:6px;cursor:pointer;font-weight:500;font-size:13px}
.btn-p:hover{background:#2563eb}
.btn-s{background:#eff6ff;color:#2563eb;border:none;padding:8px 16px;border-radius:6px;cursor:pointer;font-weight:500;font-size:13px}
.btn-s:hover{background:#dbeafe}
.chk-row{display:flex;align-items:center;justify-content:space-between;margin:8px 0}
.chk-row label{font-size:11px;font-weight:600;color:var(--muted);text-transform:uppercase;cursor:pointer}
.chk-row input{width:16px;height:16px;cursor:pointer}
.empty-msg{text-align:center;color:#9ca3af;padding:40px 20px;font-size:13px}
.empty-msg i{font-size:28px;margin-bottom:10px;display:block}
.page-item{display:flex;align-items:center;justify-content:space-between;padding:8px 12px;border-radius:8px;font-size:13px;margin-bottom:6px;border:1px solid var(--border);background:#fff;cursor:pointer}
.page-item.active{border-color:var(--primary);background:#eff6ff;color:#1d4ed8;font-weight:600}
.page-item .actions{display:flex;gap:4px;opacity:.3;transition:opacity .2s}
.page-item:hover .actions{opacity:1}
.page-item .actions button{background:none;border:none;color:#9ca3af;cursor:pointer;padding:3px 5px;border-radius:4px;font-size:11px}
.canvas-wrap.drag-over .canvas{outline:2px dashed var(--primary);outline-offset:-2px}
.e-btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:10px 20px;border:none;border-radius:8px;cursor:pointer;font-size:15px;text-decoration:none;font-family:inherit;width:100%;height:100%}
.e-img{width:100%;height:100%;object-fit:cover;display:block;border-radius:inherit}
.e-video,.e-audio{width:100%;border-radius:inherit}
.e-iframe{width:100%;height:100%;border:none;border-radius:inherit}
.e-form{display:flex;flex-direction:column;gap:10px}
.e-input{width:100%;padding:9px 12px;border:1px solid #d1d5db;border-radius:6px;font-size:14px;font-family:inherit;outline:none}
.e-input:focus{border-color:var(--primary);box-shadow:0 0 0 2px rgba(59,130,246,.15)}
.e-label{font-size:12px;font-weight:600;color:#374151;margin-bottom:3px;display:block}
.e-details{border:1px solid #e5e7eb;border-radius:8px;overflow:hidden}
.e-details summary{padding:12px 16px;cursor:pointer;background:#f9fafb;font-weight:600;list-style:none;position:relative;padding-right:36px}
.e-details summary::-webkit-details-marker{display:none}
.e-details summary::after{content:'+';position:absolute;right:16px;font-size:20px;color:var(--primary)}
.e-details[open] summary::after{content:'−'}
.e-details .details-content{padding:12px 16px;border-top:1px solid #e5e7eb}
.e-table{width:100%;border-collapse:collapse}
.e-table th,.e-table td{border:1px solid #e5e7eb;padding:8px 12px;text-align:left}
.e-table th{background:#f9fafb;font-weight:600}
.e-progress{width:100%;height:20px;background:#e5e7eb;border-radius:10px;overflow:hidden}
.e-progress-bar{height:100%;background:var(--primary);display:flex;align-items:center;justify-content:center;color:#fff;font-size:11px;font-weight:600}
.e-badge{display:inline-block;padding:3px 10px;border-radius:20px;font-size:12px;font-weight:600}
.e-alert{padding:12px 16px;border-radius:8px;border-left:4px solid;font-size:14px;display:flex;gap:10px;align-items:flex-start}
.e-alert-info{background:#eff6ff;border-color:#3b82f6;color:#1e40af}
.e-alert-success{background:#f0fdf4;border-color:#10b981;color:#065f46}
.e-alert-warning{background:#fffbeb;border-color:#f59e0b;color:#92400e}
.e-alert-danger{background:#fef2f2;border-color:#ef4444;color:#991b1b}
.e-code{background:#1e293b;color:#e2e8f0;padding:14px 16px;border-radius:8px;font-family:'Courier New',monospace;font-size:13px;overflow-x:auto;white-space:pre;margin:0;height:100%;box-sizing:border-box}
.e-blockquote{border-left:4px solid var(--primary);padding:10px 16px;margin:0;background:#f9fafb;font-style:italic;color:#4b5563;border-radius:0 8px 8px 0;height:100%;box-sizing:border-box;display:flex;align-items:center}
.e-list{padding-left:24px;margin:0}
.e-list li{margin-bottom:4px}
.e-divider{border:none;border-top:2px solid #e5e7eb;margin:8px 0;width:100%}
.e-counter{font-size:48px;font-weight:700;text-align:center;color:var(--primary)}
.tcard{background:#fff;border:1px solid #e5e7eb;border-radius:12px;overflow:hidden;box-shadow:0 2px 8px rgba(0,0,0,.06);height:100%;display:flex;flex-direction:column}
.tcard-img{width:100%;height:180px;object-fit:cover;display:block;flex-shrink:0;background:#f3f4f6}
.tcard-body{padding:16px;display:flex;flex-direction:column;gap:8px;flex:1}
.tcard-title{font-weight:700;font-size:17px;margin:0;color:#1f2937;line-height:1.3}
.tcard-text{color:#6b7280;font-size:13px;margin:0;line-height:1.5;flex:1}
.tcard-btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:9px 16px;background:#3b82f6;color:#fff;border:none;border-radius:8px;cursor:pointer;font-size:13px;font-weight:600;text-decoration:none;font-family:inherit;align-self:flex-start;margin-top:4px}
.tcard-horizontal{flex-direction:row}
.tcard-horizontal .tcard-img{width:40%;height:100%}
.tcard-overlay{position:relative;overflow:hidden;border-radius:12px;height:100%}
.tcard-overlay-img{position:absolute;top:0;left:0;width:100%;height:100%;object-fit:cover}
.tcard-overlay-body{position:absolute;bottom:0;left:0;right:0;padding:20px;background:linear-gradient(transparent,rgba(0,0,0,.85));color:#fff}
.tcard-overlay-title{font-weight:700;font-size:18px;margin:0 0 6px;color:#fff}
.tcard-overlay-text{font-size:13px;margin:0 0 12px;color:rgba(255,255,255,.9);line-height:1.5}
.tcard-overlay .tcard-btn{background:#fff;color:#1f2937}
.tcard-circle img{border-radius:50%;width:100px;height:100px;margin:16px auto 8px;display:block;object-fit:cover;border:3px solid #e5e7eb}
.tcard-circle .tcard-body{padding-top:0;text-align:center}
.tcard-circle .tcard-title,.tcard-circle .tcard-text{text-align:center}
.tcard-circle .tcard-btn{align-self:center}
.carousel{position:relative;width:100%;height:100%;overflow:hidden;display:flex;align-items:center;justify-content:center;border-radius:inherit}
.carousel-slide{position:absolute;top:0;left:0;width:100%;height:100%;object-fit:cover;opacity:0;transition:all .5s ease}
.carousel-slide.active{opacity:1;z-index:1}
.carousel-arrow{position:absolute;top:50%;transform:translateY(-50%);background:rgba(0,0,0,.6);color:#fff;border:none;width:40px;height:40px;border-radius:50%;cursor:pointer;z-index:20;display:flex;align-items:center;justify-content:center}
.carousel-arrow.prev{left:12px}.carousel-arrow.next{right:12px}
.carousel-dots{position:absolute;bottom:12px;left:50%;transform:translateX(-50%);display:flex;gap:8px;z-index:20}
.carousel-dot{width:12px;height:12px;border-radius:50%;background:rgba(255,255,255,.5);cursor:pointer;border:1px solid rgba(0,0,0,.2)}
.carousel-dot.active{background:#fff}
.gallery-wrap{position:relative;width:100%;height:100%;overflow:hidden;border-radius:inherit;background:#f3f4f6}
.gallery-track{display:flex;height:100%;gap:8px;transition:transform .6s cubic-bezier(.4,0,.2,1);align-items:center;padding:8px}
.gallery-item{flex:0 0 auto;height:100%;border-radius:8px;overflow:hidden;background:#e5e7eb;box-shadow:0 2px 6px rgba(0,0,0,.08)}
.gallery-item img{width:100%;height:100%;object-fit:cover;display:block}
.gallery-arrow{position:absolute;top:50%;transform:translateY(-50%);background:rgba(0,0,0,.55);color:#fff;border:none;width:38px;height:38px;border-radius:50%;cursor:pointer;z-index:20;display:flex;align-items:center;justify-content:center}
.gallery-arrow.prev{left:10px}.gallery-arrow.next{right:10px}
.gallery-dots{position:absolute;bottom:8px;left:50%;transform:translateX(-50%);display:flex;gap:6px;z-index:20;background:rgba(0,0,0,.35);padding:4px 8px;border-radius:20px}
.gallery-dot{width:8px;height:8px;border-radius:50%;background:rgba(255,255,255,.5);cursor:pointer}
.gallery-dot.active{background:#fff}
.cardcar-wrap{position:relative;width:100%;height:100%;overflow:hidden;border-radius:inherit}
.cardcar-track{display:flex;height:100%;gap:16px;transition:transform .6s cubic-bezier(.4,0,.2,1);align-items:stretch;padding:8px}
.cardcar-item{flex:0 0 auto;height:100%;display:flex;flex-direction:column;background:#fff;border:1px solid #e5e7eb;border-radius:12px;overflow:hidden;box-shadow:0 2px 8px rgba(0,0,0,.06)}
.cardcar-img{width:100%;height:55%;object-fit:cover;display:block;background:#f3f4f6;flex-shrink:0}
.cardcar-body{padding:14px;display:flex;flex-direction:column;gap:6px;flex:1;overflow:hidden}
.cardcar-title{font-weight:700;font-size:15px;margin:0;color:#1f2937;line-height:1.3}
.cardcar-text{color:#6b7280;font-size:12px;margin:0;line-height:1.4;flex:1;overflow:hidden}
.cardcar-btn{display:inline-flex;align-items:center;justify-content:center;padding:7px 14px;background:#3b82f6;color:#fff;border:none;border-radius:6px;cursor:pointer;font-size:12px;font-weight:600;text-decoration:none;font-family:inherit;align-self:flex-start}
.cardcar-arrow{position:absolute;top:50%;transform:translateY(-50%);background:rgba(0,0,0,.6);color:#fff;border:none;width:40px;height:40px;border-radius:50%;cursor:pointer;z-index:20;display:flex;align-items:center;justify-content:center}
.cardcar-arrow.prev{left:12px}.cardcar-arrow.next{right:12px}
.cardcar-dots{position:absolute;bottom:8px;left:50%;transform:translateX(-50%);display:flex;gap:6px;z-index:20;background:rgba(0,0,0,.4);padding:4px 8px;border-radius:20px}
.cardcar-dot{width:8px;height:8px;border-radius:50%;background:rgba(255,255,255,.5);cursor:pointer}
.cardcar-dot.active{background:#fff}
.e-sep{display:flex;align-items:center;justify-content:center;width:100%;height:100%}
.e-sep-line{flex:1;height:2px;background:linear-gradient(90deg,transparent,#e5e7eb,transparent)}
.e-sep-icon{color:#3b82f6;font-size:16px;margin:0 12px}
.e-stars{color:#f59e0b;font-size:20px;letter-spacing:2px}
.e-nav{display:flex;align-items:center;justify-content:space-between;padding:12px 24px;background:#fff;border-bottom:1px solid #e5e7eb;width:100%;height:100%}
.e-nav-logo{font-weight:800;font-size:18px;color:#1f2937;text-decoration:none}
.e-nav-links{display:flex;gap:24px;list-style:none;margin:0;padding:0}
.e-nav-links a{color:#4b5563;text-decoration:none;font-size:14px;font-weight:500}
.e-nav-links a:hover{color:#3b82f6}
.e-footer{background:#1f2937;color:#d1d5db;padding:40px 24px;width:100%;height:100%;display:flex;flex-direction:column;justify-content:center;gap:16px}
.e-footer h3{color:#fff;font-size:18px;margin:0 0 8px}
.e-footer p{color:#9ca3af;font-size:13px;margin:0;line-height:1.6}
.e-footer-social{display:flex;gap:12px;margin-top:8px}
.e-footer-social a{color:#9ca3af;font-size:20px}
.e-footer-social a:hover{color:#3b82f6}
.e-price{display:flex;align-items:baseline;gap:8px}
.e-price-new{font-size:28px;font-weight:800;color:#ef4444}
.e-timeline{position:relative;padding-left:28px;width:100%;height:100%;overflow-y:auto}
.e-timeline::before{content:'';position:absolute;left:10px;top:0;bottom:0;width:2px;background:#e5e7eb}
.e-timeline-item{position:relative;margin-bottom:20px}
.e-timeline-item::before{content:'';position:absolute;left:-22px;top:4px;width:12px;height:12px;border-radius:50%;background:#3b82f6;border:2px solid #fff;box-shadow:0 0 0 2px #3b82f6}
.e-timeline-date{font-size:11px;color:#9ca3af;font-weight:600;text-transform:uppercase;margin-bottom:4px}
.e-timeline-title{font-weight:700;font-size:15px;color:#1f2937;margin:0 0 4px}
.e-timeline-text{font-size:13px;color:#6b7280;margin:0;line-height:1.5}
.e-pricing{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:16px;width:100%;height:100%;padding:8px}
.e-price-card{background:#fff;border:2px solid #e5e7eb;border-radius:12px;padding:20px;display:flex;flex-direction:column;gap:10px;text-align:center}
.e-price-card.featured{border-color:#3b82f6;box-shadow:0 8px 24px rgba(59,130,246,.15)}
.e-price-card h3{font-size:14px;color:#6b7280;margin:0;text-transform:uppercase;letter-spacing:1px}
.e-price-card .amount{font-size:36px;font-weight:800;color:#1f2937;margin:0}
.e-price-card .amount span{font-size:14px;font-weight:400;color:#9ca3af}
.e-price-card ul{list-style:none;padding:0;margin:0;text-align:left;font-size:13px;color:#4b5563}
.e-price-card ul li{padding:6px 0;border-bottom:1px solid #f3f4f6}
.e-price-card ul li::before{content:'✓ ';color:#10b981;font-weight:700}
.e-testimonial{display:flex;gap:16px;padding:20px;background:#fff;border-radius:12px;border:1px solid #e5e7eb;box-shadow:0 2px 8px rgba(0,0,0,.05);height:100%;align-items:center}
.e-testimonial img{width:70px;height:70px;border-radius:50%;object-fit:cover;flex-shrink:0}
.e-testimonial-text{font-size:14px;color:#4b5563;font-style:italic;margin:0 0 6px;line-height:1.5}
.e-testimonial-author{font-weight:700;font-size:13px;color:#1f2937;margin:0}
.e-testimonial-role{font-size:12px;color:#9ca3af;margin:0}
.e-socials{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;align-items:center;height:100%}
.e-social{display:inline-flex;align-items:center;justify-content:center;width:44px;height:44px;border-radius:50%;color:#fff;text-decoration:none;font-size:18px;transition:transform .2s}
.e-social:hover{transform:scale(1.1)}
.e-countdown{display:flex;gap:12px;justify-content:center;align-items:center;height:100%}
.e-cd-box{background:#1f2937;color:#fff;padding:16px 20px;border-radius:8px;text-align:center;min-width:70px}
.e-cd-num{font-size:28px;font-weight:800;display:block;line-height:1}
.e-cd-lbl{font-size:10px;text-transform:uppercase;letter-spacing:1px;color:#9ca3af;margin-top:4px;display:block}
.e-stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:16px;width:100%;height:100%;align-items:center;padding:8px}
.e-stat{text-align:center}
.e-stat-num{font-size:36px;font-weight:800;color:#3b82f6;display:block;line-height:1}
.e-stat-lbl{font-size:12px;color:#6b7280;text-transform:uppercase;letter-spacing:1px;margin-top:6px;display:block}
.e-hero{width:100%;height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:40px;color:#fff;border-radius:inherit;box-sizing:border-box}
.e-hero h1{font-size:42px;font-weight:800;margin:0 0 12px;line-height:1.1}
.e-hero p{font-size:16px;margin:0 0 24px;opacity:.9;max-width:600px}
.e-hero-btn{display:inline-block;padding:14px 32px;background:#fff;color:#3b82f6;border-radius:8px;text-decoration:none;font-weight:700;font-size:15px}
.e-checklist{list-style:none;padding:0;margin:0}
.e-checklist li{display:flex;gap:10px;padding:8px 0;align-items:flex-start;font-size:14px;color:#374151}
.e-checklist li::before{content:'✓';color:#10b981;font-weight:800;font-size:16px;flex-shrink:0}
.e-circle-prog{position:relative;width:120px;height:120px;margin:auto}
.e-circle-prog svg{width:100%;height:100%;transform:rotate(-90deg)}
.e-circle-prog circle{fill:none;stroke-width:8}
.e-circle-prog .bg{stroke:#e5e7eb}
.e-circle-prog .fg{stroke:#3b82f6;stroke-linecap:round;stroke-dasharray:314}
.e-circle-prog .txt{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);font-size:24px;font-weight:800;color:#3b82f6}
.e-ribbon{color:#fff;text-align:center;padding:8px 16px;font-weight:600;font-size:13px;border-radius:6px;width:100%;height:100%;display:flex;align-items:center;justify-content:center;box-sizing:border-box}
.e-whatsapp{position:relative;width:60px;height:60px;background:#25d366;border-radius:50%;display:flex;align-items:center;justify-content:center;color:#fff;font-size:30px;text-decoration:none;box-shadow:0 4px 12px rgba(37,211,102,.4);margin:auto}
.e-masonry{column-count:3;column-gap:12px;width:100%;height:100%;overflow:hidden}
.e-masonry img{width:100%;margin-bottom:12px;border-radius:8px;display:block}
.e-img-overlay{position:relative;width:100%;height:100%;overflow:hidden;border-radius:inherit}
.e-img-overlay img{width:100%;height:100%;object-fit:cover;display:block}
.e-img-overlay-txt{position:absolute;bottom:0;left:0;right:0;padding:20px;background:linear-gradient(transparent,rgba(0,0,0,.8));color:#fff}
.nav-link-edit{background:#f9fafb;padding:8px;border-radius:6px;margin-bottom:8px;border:1px solid #e5e7eb}
.nav-link-edit .nav-row{display:flex;gap:6px;margin-bottom:6px;align-items:center}
.nav-link-edit input{flex:1;padding:5px 8px;font-size:12px;border:1px solid #d1d5db;border-radius:4px;outline:none}
.nav-link-edit input:focus{border-color:var(--primary)}
.nav-link-edit .del-btn{padding:5px 8px;background:#fef2f2;color:#dc2626;border:none;border-radius:4px;cursor:pointer;font-size:11px}
.nav-link-edit .del-btn:hover{background:#fee2e2}
.nav-link-edit label{font-size:10px;color:#6b7280;font-weight:600;text-transform:uppercase;display:block;margin-bottom:2px}
.border-preview{width:100%;height:40px;border-radius:6px;margin-top:6px;display:flex;align-items:center;justify-content:center;font-size:11px;color:#9ca3af;background:#f9fafb;transition:all .2s;box-sizing:border-box}
.color-editor{margin-bottom:12px}
.color-editor .tabs-color{display:flex;gap:4px;margin-bottom:8px;background:#f3f4f6;padding:3px;border-radius:6px}
.color-editor .tabs-color button{flex:1;padding:5px;border:none;background:transparent;border-radius:4px;font-size:11px;font-weight:600;color:#6b7280;cursor:pointer;transition:all .15s}
.color-editor .tabs-color button.active{background:#fff;color:var(--primary);box-shadow:0 1px 3px rgba(0,0,0,.08)}
.color-editor .gradient-preview{width:100%;height:36px;border-radius:6px;margin-top:6px;border:1px solid #e5e7eb;cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:10px;color:rgba(255,255,255,.9);text-shadow:0 1px 2px rgba(0,0,0,.3);font-weight:600}
.grad-controls{display:flex;flex-direction:column;gap:6px}
.grad-row{display:flex;gap:6px;align-items:center}
.grad-row label{font-size:10px;color:#6b7280;font-weight:600;min-width:52px;text-transform:uppercase}
.grad-row input[type="color"]{width:32px;height:28px;padding:0;border:1px solid #e5e7eb;border-radius:4px;cursor:pointer}
.grad-row select{flex:1;padding:5px;font-size:11px;border:1px solid #d1d5db;border-radius:4px;outline:none;background:#fff}
.grad-row input[type="range"]{flex:1}
.grad-presets{display:grid;grid-template-columns:repeat(5,1fr);gap:4px;margin-top:6px}
.grad-preset{aspect-ratio:1.6;border-radius:5px;cursor:pointer;border:2px solid transparent;transition:transform .15s}
.grad-preset:hover{transform:scale(1.08);border-color:#3b82f6}
#page-config-btn{position:fixed;bottom:24px;right:calc(var(--sb) + 24px);width:52px;height:52px;background:linear-gradient(135deg,#3b82f6,#8b5cf6);border-radius:50%;display:flex;align-items:center;justify-content:center;color:#fff;font-size:22px;cursor:pointer;box-shadow:0 4px 16px rgba(59,130,246,.4);z-index:1000;transition:transform .2s}
#page-config-btn:hover{transform:scale(1.08)}
#page-config-panel{position:fixed;bottom:90px;right:calc(var(--sb) + 24px);background:#fff;border-radius:12px;box-shadow:0 12px 32px rgba(0,0,0,.18);padding:20px;width:300px;z-index:1000;display:none;border:1px solid var(--border)}
#page-config-panel.show{display:block;animation:slideUp .2s ease}
@keyframes slideUp{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
#page-config-panel h3{font-size:13px;font-weight:700;text-transform:uppercase;letter-spacing:.5px;color:#9ca3af;margin:0 0 12px;display:flex;align-items:center;gap:8px}
</style>

<body>

        <div class="rh rh-nw" data-dir="nw"></div><div class="rh rh-n" data-dir="n"></div><div class="rh rh-ne" data-dir="ne"></div>

<button id="page-config-btn" title="Color de página"><i class="fa-solid fa-palette"></i></button>

  <h3><i class="fa-solid fa-palette"></i> Fondo de la página</h3>
  <div id="page-bg-editor"></div>
</div>

<script>
/* ========== ESTADO ========== */
const state = {
  viewport:'desktop',
  currentPageId:'home',
  pages:[{id:'home',title:'Inicio',slug:'index',bgColor:'#ffffff',bgMode:'solid',elements:[]}],
  selectedId:null,
  history:[],
  historyIndex:-1
};
const canvas = document.getElementById('canvas');
const canvasWrap = document.getElementById('canvas-wrap');
const selBox = document.getElementById('sel-box');
const tabBtns = document.querySelectorAll('.tab');
const tabContents = {
  tools:document.getElementById('tab-tools'),
  pages:document.getElementById('tab-pages'),
  props:document.getElementById('tab-props')
};
const propsPanel = document.getElementById('props-panel');
const noSel = document.getElementById('no-sel');

const uid = () => 'el_'+Math.random().toString(36).substr(2,9);
const slugify = t => t.toString().toLowerCase().replace(/\s+/g,'-').replace(/[^\w\-]+/g,'').replace(/\-\-+/g,'-').replace(/^-+|-+$/g,'') || 'pagina';
const getPage = () => state.pages.find(p => p.id === state.currentPageId);
const getElements = () => getPage()?.elements || [];

/* ========== UTILIDADES ========== */
function isGradient(v){ return typeof v === 'string' && (v.startsWith('linear-gradient') || v.startsWith('radial-gradient')); }
const GRADIENT_PRESETS = [
  'linear-gradient(135deg, #3b82f6, #8b5cf6)','linear-gradient(135deg, #ec4899, #f59e0b)',
  'linear-gradient(135deg, #10b981, #0ea5e9)','linear-gradient(135deg, #f59e0b, #ef4444)',
  'linear-gradient(135deg, #06b6d4, #3b82f6)','linear-gradient(135deg, #8b5cf6, #ec4899)',
  'linear-gradient(180deg, #667eea, #764ba2)','linear-gradient(180deg, #f3f4f6, #ffffff)',
  'linear-gradient(90deg, #ff6b6b, #feca57)','linear-gradient(135deg, #000000, #434343)'
];

/* ========== CONSTRUIR BORDE ========== */
function buildBorder(el){
  const style = el.borderStyle || 'none';
  const width = el.borderWidth || 0;
  const color = el.borderColor || '#e5e7eb';
  if(style === 'none' || width === 0) return 'none';
  return `${width}px ${style} ${color}`;
}

/* ========== APLICAR COLOR/BORDE AL DOM ========== */
function applyElementStyles(dom, el){
  const border = buildBorder(el);
  
  dom.style.left = el.x+'px';
  dom.style.top = el.y+'px';
  dom.style.width = (typeof el.width==='number' ? el.width+'px' : el.width);
  dom.style.height = (typeof el.height==='number' ? el.height+'px' : el.height);
  dom.style.zIndex = el.zIndex;
  dom.style.opacity = el.opacity;
  dom.style.borderRadius = (el.borderRadius||0)+'px';
  dom.style.boxShadow = el.boxShadow||'none';
  // ⚠️ El borde se aplica SIEMPRE
  dom.style.border = border;
  dom.style.boxSizing = 'border-box';
  
  // Fondo con color o degradado
  if(isGradient(el.bgColor)){
    dom.style.background = el.bgColor;
    dom.style.backgroundColor = 'transparent';
  } else if(el.bgColor && el.bgColor !== 'transparent'){
    dom.style.background = el.bgColor;
  } else {
    dom.style.background = 'transparent';
  }
}

/* ========== COLOR EDITOR CON DEGRADADOS ========== */
function buildColorEditor(el, key, label){
  const value = el[key] || '#ffffff';
  const isGrad = isGradient(value);

  const container = document.createElement('div');
  container.className = 'color-editor';

  const header = document.createElement('label');
  header.className = 'cl';
  header.textContent = label;
  container.appendChild(header);

  const tabs = document.createElement('div');
  tabs.className = 'tabs-color';
  const tabSolid = document.createElement('button');
  tabSolid.textContent = '🎨 Sólido';
  tabSolid.className = !isGrad ? 'active' : '';
  const tabGrad = document.createElement('button');
  tabGrad.textContent = '🌈 Degradado';
  tabGrad.className = isGrad ? 'active' : '';
  tabs.appendChild(tabSolid); tabs.appendChild(tabGrad);
  container.appendChild(tabs);

  const solidBox = document.createElement('div');
  solidBox.style.display = isGrad ? 'none' : 'block';
  const safeSolid = isGrad ? '#ffffff' : value;
  const flex = document.createElement('div');
  flex.style.cssText = 'display:flex;gap:8px;align-items:center';
  const cp = document.createElement('input'); cp.type = 'color';
  cp.value = safeSolid.startsWith('#') ? safeSolid.substring(0,7) : '#ffffff';
  cp.style.cssText = 'width:32px;height:32px;padding:0;border:none;border-radius:6px;cursor:pointer';
  const ti = document.createElement('input'); ti.type = 'text'; ti.className = 'ci'; ti.value = safeSolid; ti.style.flex = '1';
  cp.oninput = e => { ti.value = e.target.value; updateElement(state.selectedId, { [key]: e.target.value }); };
  cp.onchange = () => saveHistory();
  ti.onchange = e => { cp.value = e.target.value.startsWith('#') ? e.target.value : '#ffffff'; updateElement(state.selectedId, { [key]: e.target.value }); saveHistory(); };
  flex.appendChild(cp); flex.appendChild(ti);
  solidBox.appendChild(flex);
  container.appendChild(solidBox);

  const gradBox = document.createElement('div');
  gradBox.style.display = isGrad ? 'block' : 'none';

  let gAngle = 135, gColor1 = '#3b82f6', gColor2 = '#8b5cf6';
  if(isGrad){
    const m = value.match(/linear-gradient\(([^,]+),\s*([^,]+),\s*([^,)]+)/);
    if(m){ gAngle = parseInt(m[1]) || 135; gColor1 = m[2].trim(); gColor2 = m[3].trim(); }
  }
  const makeGradString = () => `linear-gradient(${gAngle}deg, ${gColor1}, ${gColor2})`;

  const gradControls = document.createElement('div');
  gradControls.className = 'grad-controls';

  const angleRow = document.createElement('div');
  angleRow.className = 'grad-row';
  angleRow.innerHTML = '<label>Ángulo</label>';
  const angleRange = document.createElement('input'); angleRange.type = 'range'; angleRange.min = 0; angleRange.max = 360; angleRange.value = gAngle;
  const angleVal = document.createElement('span'); angleVal.style.cssText = 'font-size:11px;color:#6b7280;min-width:34px;text-align:right'; angleVal.textContent = gAngle + '°';
  angleRange.oninput = e => { gAngle = parseInt(e.target.value); angleVal.textContent = gAngle + '°'; updateElement(state.selectedId, { [key]: makeGradString() }); };
  angleRange.onchange = () => saveHistory();
  angleRow.appendChild(angleRange); angleRow.appendChild(angleVal);
  gradControls.appendChild(angleRow);

  const c1Row = document.createElement('div');
  c1Row.className = 'grad-row';
  c1Row.innerHTML = '<label>Inicio</label>';
  const c1 = document.createElement('input'); c1.type = 'color'; c1.value = gColor1.startsWith('#') ? gColor1.substring(0,7) : '#3b82f6';
  const c1t = document.createElement('input'); c1t.type = 'text'; c1t.className = 'ci'; c1t.value = gColor1; c1t.style.flex = '1';
  c1.oninput = e => { c1t.value = e.target.value; gColor1 = e.target.value; updateElement(state.selectedId, { [key]: makeGradString() }); };
  c1.onchange = () => saveHistory();
  c1t.onchange = e => { c1.value = e.target.value.startsWith('#') ? e.target.value : '#3b82f6'; gColor1 = e.target.value; updateElement(state.selectedId, { [key]: makeGradString() }); saveHistory(); };
  c1Row.appendChild(c1); c1Row.appendChild(c1t);
  gradControls.appendChild(c1Row);

  const c2Row = document.createElement('div');
  c2Row.className = 'grad-row';
  c2Row.innerHTML = '<label>Fin</label>';
  const c2 = document.createElement('input'); c2.type = 'color'; c2.value = gColor2.startsWith('#') ? gColor2.substring(0,7) : '#8b5cf6';
  const c2t = document.createElement('input'); c2t.type = 'text'; c2t.className = 'ci'; c2t.value = gColor2; c2t.style.flex = '1';
  c2.oninput = e => { c2t.value = e.target.value; gColor2 = e.target.value; updateElement(state.selectedId, { [key]: makeGradString() }); };
  c2.onchange = () => saveHistory();
  c2t.onchange = e => { c2.value = e.target.value.startsWith('#') ? e.target.value : '#8b5cf6'; gColor2 = e.target.value; updateElement(state.selectedId, { [key]: makeGradString() }); saveHistory(); };
  c2Row.appendChild(c2); c2Row.appendChild(c2t);
  gradControls.appendChild(c2Row);

  const presetsLabel = document.createElement('label');
  presetsLabel.style.cssText = 'font-size:10px;color:#6b7280;font-weight:600;text-transform:uppercase;margin-top:4px;display:block';
  presetsLabel.textContent = 'Degradados rápidos';
  gradControls.appendChild(presetsLabel);
  const presets = document.createElement('div');
  presets.className = 'grad-presets';
  GRADIENT_PRESETS.forEach(preset => {
    const p = document.createElement('div');
    p.className = 'grad-preset';
    p.style.background = preset;
    p.onclick = () => { updateElement(state.selectedId, { [key]: preset }); saveHistory(); renderProps(); };
    presets.appendChild(p);
  });
  gradControls.appendChild(presets);

  const preview = document.createElement('div');
  preview.className = 'gradient-preview';
  preview.textContent = 'Vista previa';
  preview.style.background = isGrad ? value : makeGradString();
  gradControls.appendChild(preview);

  gradBox.appendChild(gradControls);
  container.appendChild(gradBox);

  tabSolid.onclick = () => {
    tabSolid.classList.add('active'); tabGrad.classList.remove('active');
    solidBox.style.display = 'block'; gradBox.style.display = 'none';
    updateElement(state.selectedId, { [key]: safeSolid });
    saveHistory();
  };
  tabGrad.onclick = () => {
    tabGrad.classList.add('active'); tabSolid.classList.remove('active');
    solidBox.style.display = 'none'; gradBox.style.display = 'block';
    updateElement(state.selectedId, { [key]: makeGradString() });
    saveHistory();
  };

  return container;
}

/* ========== EDITOR DE COLOR DE PÁGINA ========== */
function renderPageColorEditor(){
  const box = document.getElementById('page-bg-editor');
  const page = getPage();
  if(!page) return;
  box.innerHTML = '';

  const value = page.bgColor || '#ffffff';
  const isGrad = isGradient(value);

  const tabs = document.createElement('div');
  tabs.className = 'tabs-color';
  const tabSolid = document.createElement('button');
  tabSolid.textContent = '🎨 Sólido'; tabSolid.className = !isGrad ? 'active' : '';
  const tabGrad = document.createElement('button');
  tabGrad.textContent = '🌈 Degradado'; tabGrad.className = isGrad ? 'active' : '';
  tabs.appendChild(tabSolid); tabs.appendChild(tabGrad);
  box.appendChild(tabs);

  const solidBox = document.createElement('div');
  solidBox.style.display = isGrad ? 'none' : 'block';
  const safeSolid = isGrad ? '#ffffff' : value;
  const flex = document.createElement('div');
  flex.style.cssText = 'display:flex;gap:8px;align-items:center';
  const cp = document.createElement('input'); cp.type = 'color';
  cp.value = safeSolid.startsWith('#') ? safeSolid.substring(0,7) : '#ffffff';
  cp.style.cssText = 'width:44px;height:36px;padding:0;border:none;border-radius:6px;cursor:pointer';
  const ti = document.createElement('input'); ti.type = 'text'; ti.className = 'ci'; ti.value = safeSolid; ti.style.flex = '1';
  cp.oninput = e => { ti.value = e.target.value; page.bgColor = e.target.value; canvas.style.background = e.target.value; };
  cp.onchange = () => saveHistory();
  ti.onchange = e => { cp.value = e.target.value.startsWith('#') ? e.target.value : '#ffffff'; page.bgColor = e.target.value; canvas.style.background = e.target.value; saveHistory(); };
  flex.appendChild(cp); flex.appendChild(ti);
  solidBox.appendChild(flex);

  const rapidLabel = document.createElement('label');
  rapidLabel.className = 'cl'; rapidLabel.style.marginTop = '10px'; rapidLabel.textContent = 'Colores rápidos';
  solidBox.appendChild(rapidLabel);
  const presetColors = document.createElement('div');
  presetColors.style.cssText = 'display:grid;grid-template-columns:repeat(6,1fr);gap:6px';
  ['#ffffff','#f9fafb','#f3f4f6','#fef3c7','#dbeafe','#dcfce7','#fee2e2','#fce7f3','#ede9fe','#e0f2fe','#1f2937','#000000'].forEach(c => {
    const el = document.createElement('div');
    el.style.cssText = `aspect-ratio:1;border-radius:6px;cursor:pointer;background:${c};border:2px solid ${c==='#ffffff'||c==='#f9fafb'?'#e5e7eb':'transparent'}`;
    el.onclick = () => { page.bgColor = c; canvas.style.background = c; saveHistory(); renderPageColorEditor(); };
    presetColors.appendChild(el);
  });
  solidBox.appendChild(presetColors);
  box.appendChild(solidBox);

  const gradBox = document.createElement('div');
  gradBox.style.display = isGrad ? 'block' : 'none';

  let gAngle = 135, gColor1 = '#3b82f6', gColor2 = '#8b5cf6';
  if(isGrad){
    const m = value.match(/linear-gradient\(([^,]+),\s*([^,]+),\s*([^,)]+)/);
    if(m){ gAngle = parseInt(m[1]) || 135; gColor1 = m[2].trim(); gColor2 = m[3].trim(); }
  }
  const makeGrad = () => `linear-gradient(${gAngle}deg, ${gColor1}, ${gColor2})`;

  const gradControls = document.createElement('div');
  gradControls.className = 'grad-controls';

  const angleRow = document.createElement('div');
  angleRow.className = 'grad-row';
  angleRow.innerHTML = '<label>Ángulo</label>';
  const angleRange = document.createElement('input'); angleRange.type = 'range'; angleRange.min = 0; angleRange.max = 360; angleRange.value = gAngle;
  const angleVal = document.createElement('span'); angleVal.style.cssText = 'font-size:11px;color:#6b7280;min-width:34px;text-align:right'; angleVal.textContent = gAngle + '°';
  angleRange.oninput = e => { gAngle = parseInt(e.target.value); angleVal.textContent = gAngle + '°'; page.bgColor = makeGrad(); canvas.style.background = makeGrad(); };
  angleRange.onchange = () => saveHistory();
  angleRow.appendChild(angleRange); angleRow.appendChild(angleVal);
  gradControls.appendChild(angleRow);

  const c1Row = document.createElement('div');
  c1Row.className = 'grad-row';
  c1Row.innerHTML = '<label>Inicio</label>';
  const c1 = document.createElement('input'); c1.type = 'color'; c1.value = gColor1.startsWith('#') ? gColor1.substring(0,7) : '#3b82f6';
  const c1t = document.createElement('input'); c1t.type = 'text'; c1t.className = 'ci'; c1t.value = gColor1; c1t.style.flex = '1';
  c1.oninput = e => { c1t.value = e.target.value; gColor1 = e.target.value; page.bgColor = makeGrad(); canvas.style.background = makeGrad(); };
  c1.onchange = () => saveHistory();
  c1t.onchange = e => { c1.value = e.target.value.startsWith('#') ? e.target.value : '#3b82f6'; gColor1 = e.target.value; page.bgColor = makeGrad(); canvas.style.background = makeGrad(); saveHistory(); };
  c1Row.appendChild(c1); c1Row.appendChild(c1t);
  gradControls.appendChild(c1Row);

  const c2Row = document.createElement('div');
  c2Row.className = 'grad-row';
  c2Row.innerHTML = '<label>Fin</label>';
  const c2 = document.createElement('input'); c2.type = 'color'; c2.value = gColor2.startsWith('#') ? gColor2.substring(0,7) : '#8b5cf6';
  const c2t = document.createElement('input'); c2t.type = 'text'; c2t.className = 'ci'; c2t.value = gColor2; c2t.style.flex = '1';
  c2.oninput = e => { c2t.value = e.target.value; gColor2 = e.target.value; page.bgColor = makeGrad(); canvas.style.background = makeGrad(); };
  c2.onchange = () => saveHistory();
  c2t.onchange = e => { c2.value = e.target.value.startsWith('#') ? e.target.value : '#8b5cf6'; gColor2 = e.target.value; page.bgColor = makeGrad(); canvas.style.background = makeGrad(); saveHistory(); };
  c2Row.appendChild(c2); c2Row.appendChild(c2t);
  gradControls.appendChild(c2Row);

  const presetsLabel = document.createElement('label');
  presetsLabel.style.cssText = 'font-size:10px;color:#6b7280;font-weight:600;text-transform:uppercase;margin-top:4px;display:block';
  presetsLabel.textContent = 'Degradados rápidos';
  gradControls.appendChild(presetsLabel);

  const presets = document.createElement('div');
  presets.className = 'grad-presets';
  GRADIENT_PRESETS.forEach(preset => {
    const p = document.createElement('div');
    p.className = 'grad-preset';
    p.style.background = preset;
    p.onclick = () => { page.bgColor = preset; canvas.style.background = preset; saveHistory(); renderPageColorEditor(); };
    presets.appendChild(p);
  });
  gradControls.appendChild(presets);

  const preview = document.createElement('div');
  preview.className = 'gradient-preview';
  preview.textContent = 'Vista previa';
  preview.style.background = isGrad ? value : makeGrad();
  gradControls.appendChild(preview);

  gradBox.appendChild(gradControls);
  box.appendChild(gradBox);

  tabSolid.onclick = () => { page.bgColor = safeSolid; canvas.style.background = safeSolid; saveHistory(); renderPageColorEditor(); };
  tabGrad.onclick = () => { page.bgColor = makeGrad(); canvas.style.background = makeGrad(); saveHistory(); renderPageColorEditor(); };
}

function applyPageBg(){
  const page = getPage();
  if(!page) return;
  canvas.style.background = page.bgColor || '#ffffff';
  renderPageColorEditor();
}

document.getElementById('page-config-btn').onclick = (e) => {
  e.stopPropagation();
  document.getElementById('page-config-panel').classList.toggle('show');
};
document.addEventListener('click', e => {
  const panel = document.getElementById('page-config-panel');
  const btn = document.getElementById('page-config-btn');
  if(panel.classList.contains('show') && !panel.contains(e.target) && !btn.contains(e.target)){
    panel.classList.remove('show');
  }
});

/* ========== HISTORIAL ========== */
const saveHistory = () => {
  const s = JSON.stringify(state.pages);
  state.history = state.history.slice(0, state.historyIndex+1);
  state.history.push(s);
  state.historyIndex++;
};
const undo = () => {
  if(state.historyIndex > 0){
    state.historyIndex--;
    state.pages = JSON.parse(state.history[state.historyIndex]);
    clearSel(); renderAll(); renderPages(); applyPageBg();
  }
};
const redo = () => {
  if(state.historyIndex < state.history.length-1){
    state.historyIndex++;
    state.pages = JSON.parse(state.history[state.historyIndex]);
    clearSel(); renderAll(); renderPages(); applyPageBg();
  }
};
document.getElementById('btn-undo').onclick = undo;
document.getElementById('btn-redo').onclick = redo;
document.addEventListener('keydown', e => {
  if((e.ctrlKey||e.metaKey) && e.key === 'z'){ e.shiftKey?redo():undo(); e.preventDefault(); }
  else if((e.ctrlKey||e.metaKey) && e.key === 'y'){ redo(); e.preventDefault(); }
  else if((e.key==='Delete'||e.key==='Backspace') && state.selectedId){
    if(e.target.tagName!=='INPUT' && e.target.tagName!=='TEXTAREA' && !e.target.isContentEditable){
      deleteEl(state.selectedId);
    }
  }
});

/* ========== CRUD ========== */
function addElement(type, x, y, extra = {}){
  const props = defaults(type);
  const el = { id:uid(), type, x:Math.max(0,x), y:Math.max(0,y), ...props, ...extra };
  getElements().push(el);
  saveHistory();
  renderElement(el);
  selectElement(el.id);
}
function updateElement(id, updates){
  const el = getElements().find(e => e.id === id);
  if(!el) return;
  Object.assign(el, updates);
  const dom = document.getElementById(id);
  if(dom) syncDOM(dom, el);
  if(state.selectedId === id) updateSelBox();
}
function deleteEl(id){
  const page = getPage();
  if(!page) return;
  page.elements = page.elements.filter(e => e.id !== id);
  document.getElementById(id)?.remove();
  clearSel();
  saveHistory();
}

/* ========== RENDER ========== */
function renderAll(){
  canvas.querySelectorAll('.elemento').forEach(n => n.remove());
  getElements().forEach(renderElement);
  updateSelBox();
}
function renderElement(el){
  let dom = document.getElementById(el.id);
  if(!dom){
    dom = document.createElement('div');
    dom.id = el.id;
    dom.className = 'elemento';
    dom.addEventListener('dblclick', e => {
      if(['heading','paragraph','blockquote','badge','button','link'].includes(el.type)){
        const t = dom.querySelector('h1,h2,h3,h4,h5,h6,p,blockquote,span,a,button') || dom;
        t.contentEditable = true;
        t.focus();
        t.style.cursor = 'text';
        e.stopPropagation();
      }
    });
    dom.addEventListener('blur', e => {
      if(e.target.isContentEditable){
        e.target.contentEditable = false;
        e.target.style.cursor = '';
        updateElement(el.id, { text: e.target.innerText });
        saveHistory();
      }
    }, true);
    dom.addEventListener('mousedown', e => {
      if(e.target.isContentEditable) return;
      e.stopPropagation();
      selectElement(el.id);
      startDrag(e, el.id);
    });
    canvas.appendChild(dom);
  }
  syncDOM(dom, el);
}

function syncDOM(dom, el){
  // Aplicar todos los estilos del contenedor
  applyElementStyles(dom, el);
  
  const T = el.type;
  let html = '';

  if(T === 'heading') html = `<h${el.level} style="margin:0;font-size:${el.fontSize}px;font-weight:${el.fontWeight};color:${el.color};text-align:${el.textAlign}">${esc(el.text)}</h${el.level}>`;
  else if(T === 'paragraph') html = `<p style="margin:0;font-size:${el.fontSize}px;color:${el.color};text-align:${el.textAlign};line-height:1.6">${esc(el.text)}</p>`;

  else if(T === 'checklist') html = `<ul class="e-checklist" style="font-size:${el.fontSize}px;color:${el.color}">${el.items.map(i=>`<li style="color:${el.color}"><span style="color:${el.checkColor};font-weight:800;margin-right:8px">✓</span>${esc(i)}</li>`).join('')}</ul>`;
  else if(T === 'badge') html = `<span class="e-badge" style="font-size:${el.fontSize}px;color:${el.color};background:${el.bgColor}">${esc(el.text)}</span>`;
  else if(T === 'stars') html = `<div class="e-stars" style="font-size:${el.fontSize||20}px;color:${el.color}">${'★'.repeat(el.count)}${'☆'.repeat(5-el.count)}</div>`;
  else if(T === 'link') html = `<a href="${el.href||'#'}" target="${el.target||'_self'}" style="font-size:${el.fontSize}px;color:${el.color};text-decoration:underline">${esc(el.text)}</a>`;
  else if(T === 'button'){
    const ic = el.icon ? `<i class="fa-solid ${el.icon}"></i>` : '';
    const btnStyle = `background:transparent;color:${el.color};font-size:${el.fontSize}px;width:100%;height:100%`;
    if(el.href) html = `<a href="${el.href}" class="e-btn" style="${btnStyle}">${ic}${esc(el.text)}</a>`;
    else html = `<button class="e-btn" type="button" style="${btnStyle}">${ic}${esc(el.text)}</button>`;
  }
  else if(T === 'image'){
    const img = `<img src="${el.src}" alt="${el.alt||''}" class="e-img" style="object-fit:${el.objectFit||'cover'}" draggable="false">`;
    html = el.href ? `<a href="${el.href}" target="_blank" style="display:block;width:100%;height:100%;pointer-events:none">${img}</a>` : img;
  }
  else if(T === 'imgOverlay') html = `<div class="e-img-overlay"><img src="${el.src}" draggable="false"><div class="e-img-overlay-txt"><h2 style="margin:0 0 6px;font-size:24px;font-weight:800;color:${el.textColor||'#fff'}">${esc(el.title)}</h2><p style="margin:0;font-size:14px;opacity:.9;color:${el.textColor||'#fff'}">${esc(el.subtitle)}</p></div></div>`;
  else if(T === 'card') html = buildCard(el);
  else if(T === 'carousel') html = buildCarousel(el);
  else if(T === 'gallery') html = buildGallery(el);
  else if(T === 'cardcarousel') html = buildCardCarousel(el);
  else if(T === 'masonry') html = `<div class="e-masonry">${el.images.map(i=>`<img src="${i}" draggable="false">`).join('')}</div>`;
  else if(T === 'navbar') html = buildNavbar(el);
  else if(T === 'hero'){
    const bg = isGradient(el.bgColor) ? el.bgColor : `linear-gradient(135deg,${el.bgColor},${el.bgColor2||el.bgColor})`;
    html = `<div class="e-hero" style="background:${bg}"><h1 style="color:${el.titleColor}">${esc(el.title)}</h1><p style="color:${el.textColor}">${esc(el.subtitle)}</p><a href="${el.buttonHref||'#'}" class="e-hero-btn" style="background:${el.buttonColor};color:${el.buttonTextColor}">${esc(el.buttonText)}</a></div>`;
  }
  else if(T === 'footer') html = `<footer class="e-footer" style="background:${el.bgColor}"><h3 style="color:${el.titleColor}">${esc(el.title)}</h3><p style="color:${el.textColor}">${esc(el.text)}</p>${el.socials?`<div class="e-footer-social"><a href="#" style="color:${el.socialColor}"><i class="fa-brands fa-facebook"></i></a><a href="#" style="color:${el.socialColor}"><i class="fa-brands fa-instagram"></i></a><a href="#" style="color:${el.socialColor}"><i class="fa-brands fa-x-twitter"></i></a><a href="#" style="color:${el.socialColor}"><i class="fa-brands fa-youtube"></i></a></div>`:''}</footer>`;
  else if(T === 'divider') html = `<hr class="e-divider" style="border-top-color:${el.color}">`;
  else if(T === 'sepIcon') html = `<div class="e-sep"><div class="e-sep-line" style="background:${el.lineColor}"></div><i class="fa-solid ${el.icon} e-sep-icon" style="color:${el.color}"></i><div class="e-sep-line" style="background:${el.lineColor}"></div></div>`;
  else if(T === 'progress') html = `<div class="e-progress" style="background:${el.bgColor}"><div class="e-progress-bar" style="width:${(el.value/el.max*100)}%;background:${el.barColor};color:${el.textColor}">${el.showLabel?el.value+'%':''}</div></div>`;
  else if(T === 'circleProgress'){
    const offset = 314 - (314 * el.value / 100);
    html = `<div class="e-circle-prog"><svg viewBox="0 0 120 120"><circle class="bg" cx="60" cy="60" r="50" style="stroke:${el.bgColor}"/><circle class="fg" cx="60" cy="60" r="50" style="stroke:${el.barColor};stroke-dashoffset:${offset}"/></svg><div class="txt" style="color:${el.textColor}">${esc(el.label)}</div></div>`;
  }
  else if(T === 'counter') html = `<div><div class="e-counter" style="color:${el.numColor}">${el.value}</div><div style="text-align:center;color:${el.labelColor};font-size:14px;margin-top:4px">${esc(el.label)}</div></div>`;
  else if(T === 'stats') html = `<div class="e-stats">${el.items.map(it=>`<div class="e-stat"><span class="e-stat-num" style="color:${el.numColor}">${esc(it.num)}</span><span class="e-stat-lbl" style="color:${el.labelColor}">${esc(it.lbl)}</span></div>`).join('')}</div>`;
  else if(T === 'countdown') html = `<div class="e-countdown">${['days','hours','minutes','seconds'].map((k,i)=>`<div class="e-cd-box" style="background:${el.bgColor}"><span class="e-cd-num" style="color:${el.numColor}">${el[k]}</span><span class="e-cd-lbl" style="color:${el.labelColor}">${['Días','Horas','Min','Seg'][i]}</span></div>`).join('')}</div>`;
  else if(T === 'table'){
    let t = `<table class="e-table" style="background:${el.bgColor}">`;
    el.rows.forEach((r,i) => {
      const isHeader = (i===0 && el.header);
      const tag = isHeader ? 'th' : 'td';
      const style = isHeader ? `background:${el.headerBg};color:${el.headerColor};border-color:${el.borderColor}` : `color:${el.textColor};border-color:${el.borderColor}`;
      t += `<tr>${r.map(c => `<${tag} style="${style}">${esc(c)}</${tag}>`).join('')}</tr>`;
    });
    t += `</table>`;
    html = t;
  }
  else if(T === 'pricing') html = `<div class="e-pricing">${el.plans.map(p=>`<div class="e-price-card ${p.featured?'featured':''}" style="background:${el.bgColor};border-color:${p.featured?el.featuredColor:'#e5e7eb'}"><h3 style="color:${el.mutedColor}">${esc(p.name)}</h3><div class="amount" style="color:${el.textColor}">${esc(p.price)}<span style="color:${el.mutedColor}">${esc(p.period)}</span></div><ul style="color:${el.textColor}">${p.features.map(f=>`<li style="color:${el.textColor}"><span style="color:${el.checkColor};font-weight:700">✓</span> ${esc(f)}</li>`).join('')}</ul><button class="e-btn" style="background:${p.featured?el.featuredColor:'#e5e7eb'};color:${p.featured?'#fff':el.textColor};width:100%">Elegir</button></div>`).join('')}</div>`;
  else if(T === 'video') html = `<video class="e-video" src="${el.src}" ${el.controls?'controls':''} ${el.autoplay?'autoplay':''} ${el.loop?'loop':''} ${el.muted?'muted':''} style="width:100%;height:100%"></video>`;
  else if(T === 'audio') html = `<audio class="e-audio" src="${el.src}" ${el.controls?'controls':''} style="width:100%"></audio>`;
  else if(T === 'iframe') html = `<iframe class="e-iframe" src="${el.src}" allowfullscreen loading="lazy"></iframe>`;
  else if(T === 'testimonial') html = `<div class="e-testimonial" style="background:${el.bgColor};border-color:${el.borderColor}"><img src="${el.avatar}" draggable="false"><div><p class="e-testimonial-text" style="color:${el.textColor}">"${esc(el.text)}"</p><p class="e-testimonial-author" style="color:${el.authorColor}">${esc(el.author)}</p><p class="e-testimonial-role" style="color:${el.roleColor}">${esc(el.role)}</p></div></div>`;
  else if(T === 'form'){
    const f = (el.fields||[]).map(x => {
      const req = x.required ? 'required' : '';
      if(x.type === 'textarea') return `<div><label class="e-label" style="color:${el.labelColor}">${esc(x.label||'')}</label><textarea class="e-input" placeholder="${esc(x.placeholder||'')}" rows="3" ${req}></textarea></div>`;
      return `<div><label class="e-label" style="color:${el.labelColor}">${esc(x.label||'')}</label><input type="${x.type||'text'}" class="e-input" placeholder="${esc(x.placeholder||'')}" ${req}></div>`;

  }
  else if(T === 'input'){
    const req = el.required ? 'required' : '';
    const val = el.value !== undefined ? `value="${el.value}"` : '';
    html = `<div><label class="e-label" style="color:${el.labelColor}">${esc(el.label||'')}</label><input type="${el.inputType||'text'}" class="e-input" placeholder="${esc(el.placeholder||'')}" ${req} ${val}></div>`;

  else if(T === 'checkbox') html = `<label style="display:flex;align-items:center;gap:8px;font-size:14px;cursor:pointer;color:${el.color}"><input type="checkbox" ${el.checked?'checked':''}> ${esc(el.label)}</label>`;

  else if(T === 'ribbon') html = `<div class="e-ribbon" style="background:${el.bgColor};color:${el.color}">${esc(el.text)}</div>`;

  }
  else if(T === 'social') html = `<a href="${el.url}" target="_blank" style="display:flex;align-items:center;justify-content:center;width:100%;height:100%;border-radius:${el.shape==='circle'?'50%':'8px'};background:${el.color};color:#fff;text-decoration:none"><i class="${el.icon}" style="font-size:${el.size}px"></i></a>`;

function buildNavbar(el){
  const links = el.navLinks || [];
  const bg = el.bgColor || '#ffffff';
  const textColor = el.textColor || '#4b5563';
  const brandColor = el.brandColor || '#1f2937';
  let h = `<nav class="e-nav" style="background:${bg};border-bottom:1px solid #e5e7eb">`;
  h += `<a href="${el.brandHref||'#'}" class="e-nav-logo" style="color:${brandColor}">${esc(el.brand)}</a>`;
  h += `<ul class="e-nav-links">`;
  links.forEach(l => {
    h += `<li><a href="${l.href||'#'}" target="${l.target||'_self'}" style="color:${textColor}">${esc(l.text)}</a></li>`;
  });
  h += `</ul></nav>`;
  return h;
}

function buildCard(el){
  const style = el.cardStyle || 'basic';
  const imgH = el.imgHeight || 180;
  const btnStyle = `background:${el.buttonColor||'#3b82f6'};color:#fff`;
  const cardBg = el.bgColor || '#ffffff';
  const titleColor = el.titleColor || '#1f2937';
  const textColor = el.textColor || '#6b7280';
  const titleStyle = `color:${titleColor}`;
  const textStyle = `color:${textColor}`;
  const bgStyle = `background:${cardBg}`;
  if(style === 'basic') return `<div class="tcard" style="${bgStyle}">${el.img?`<img src="${el.img}" class="tcard-img" style="height:${imgH}px" draggable="false">`:''}<div class="tcard-body"><h3 class="tcard-title" style="${titleStyle}">${esc(el.title)}</h3><p class="tcard-text" style="${textStyle}">${esc(el.text)}</p>${el.buttonText?`<a href="${el.buttonHref||'#'}" class="tcard-btn" style="${btnStyle}">${esc(el.buttonText)}</a>`:''}</div></div>`;

function buildCarousel(el){
  const effect = el.transition || 'fade';
  let h = `<div class="carousel" data-autoplay="${el.autoplay}" data-interval="${el.interval||3000}" data-transition="${effect}">`;
  el.images.forEach((img, i) => {
    let extra = 'transition:all .5s ease;';
    if(effect === 'fade') extra += `opacity:${i===0?1:0};position:absolute;`;
    else if(effect === 'slide') extra += `transform:translateX(${i===0?'0%':'100%'});position:absolute;`;
    h += `<img src="${img}" class="carousel-slide ${i===0?'active':''}" style="object-fit:cover;width:100%;height:100%;${extra}" draggable="false" data-i="${i}">`;
  });
  if(el.showArrows && el.images.length > 0){
    const arrowStyle = `background:rgba(0,0,0,0.6);color:${el.arrowColor||'#fff'}`;
    h += `<button class="carousel-arrow prev" type="button" style="${arrowStyle}"><i class="fa-solid fa-chevron-left"></i></button><button class="carousel-arrow next" type="button" style="${arrowStyle}"><i class="fa-solid fa-chevron-right"></i></button>`;
  }
  if(el.showDots && el.images.length > 0){
    h += `<div class="carousel-dots">`;
    el.images.forEach((_, i) => h += `<div class="carousel-dot ${i===0?'active':''}" data-i="${i}" style="background:${i===0?(el.dotColor||'#fff'):'rgba(255,255,255,0.5)'}"></div>`);
    h += `</div>`;
  }
  h += `</div>`;
  return h;
}
function initCarousel(dom, el){
  const container = dom.querySelector('.carousel');
  if(!container) return;
  let idx = 0;
  const slides = container.querySelectorAll('.carousel-slide');
  const dots = container.querySelectorAll('.carousel-dot');
  if(!slides.length) return;
  const effect = el.transition || 'fade';
  const dotColor = el.dotColor || '#ffffff';
  const update = n => {
    idx = (n + slides.length) % slides.length;
    slides.forEach((s, i) => {
      s.classList.remove('active');
      if(effect === 'fade') s.style.opacity = i === idx ? '1' : '0';
      else if(effect === 'slide'){ s.style.transform = `translateX(${(i-idx)*100}%)`; s.style.opacity = '1'; }
    });
    slides[idx].classList.add('active');
    dots.forEach((d, i) => {
      d.classList.toggle('active', i === idx);
      d.style.background = i === idx ? dotColor : 'rgba(255,255,255,0.5)';
    });
  };
  const prev = container.querySelector('.prev');
  const next = container.querySelector('.next');
  if(prev) prev.onclick = e => { e.stopPropagation(); update(idx-1); };
  if(next) next.onclick = e => { e.stopPropagation(); update(idx+1); };
  dots.forEach((d, i) => d.onclick = e => { e.stopPropagation(); update(i); });
  if(el.autoplay && el.interval){ if(container._timer) clearInterval(container._timer); container._timer = setInterval(() => update(idx+1), el.interval); }
}

function buildGallery(el){
  const total = el.images.length;
  const perView = el.itemsPerView || 3;
  const gap = el.gap || 8;
  let h = `<div class="gallery-wrap" style="background:${el.bgColor||'#f3f4f6'}" data-perview="${perView}" data-gap="${gap}" data-autoplay="${el.autoplay}" data-interval="${el.interval||2500}"><div class="gallery-track" style="gap:${gap}px">`;
  el.images.forEach((img, i) => { h += `<div class="gallery-item" style="width:calc((100% - ${gap*(perView-1)}px)/${perView})"><img src="${img}" draggable="false" data-i="${i}"></div>`; });
  h += `</div>`;
  if(el.showArrows && total > perView){
    const arrowStyle = `background:rgba(0,0,0,0.55);color:${el.arrowColor||'#fff'}`;
    h += `<button class="gallery-arrow prev" type="button" style="${arrowStyle}"><i class="fa-solid fa-chevron-left"></i></button><button class="gallery-arrow next" type="button" style="${arrowStyle}"><i class="fa-solid fa-chevron-right"></i></button>`;
  }

  h += `</div>`;

function initGallery(dom, el){
  const wrap = dom.querySelector('.gallery-wrap');
  if(!wrap) return;
  const track = wrap.querySelector('.gallery-track');
  const items = track.querySelectorAll('.gallery-item');
  const dots = wrap.querySelectorAll('.gallery-dot');

  const gap = el.gap || 8;
  const pages = Math.max(1, Math.ceil(items.length / perView));
  let page = 0;
  const update = () => {
    const itemW = items[0].getBoundingClientRect().width;
    const offset = page * perView * (itemW + gap);
    track.style.transform = `translateX(-${offset}px)`;
    dots.forEach((d, i) => d.classList.toggle('active', i === page));
  };
  const prev = wrap.querySelector('.gallery-arrow.prev');
  const next = wrap.querySelector('.gallery-arrow.next');
  const go = n => { page = (n + pages) % pages; update(); };

  if(next) next.onclick = e => { e.stopPropagation(); go(page+1); };
  dots.forEach((d, i) => d.onclick = e => { e.stopPropagation(); page = i; update(); });
  window.addEventListener('resize', update);
  setTimeout(update, 50);
  if(el.autoplay && el.interval && pages > 1){ if(wrap._timer) clearInterval(wrap._timer); wrap._timer = setInterval(() => go(page+1), el.interval); }
}

let drag = null;
function startDrag(e, id){
  if(e.target.classList.contains('rh')) return;
  const el = getElements().find(x => x.id === id);
  if(!el) return;
  drag = { type:'move', id, sx:e.clientX, sy:e.clientY, ox:el.x, oy:el.y };
  document.addEventListener('mousemove', onDrag);
  document.addEventListener('mouseup', endDrag);
}
document.querySelectorAll('.rh').forEach(h => {
  h.addEventListener('mousedown', e => {
    e.stopPropagation();
    if(!state.selectedId) return;
    const el = getElements().find(x => x.id === state.selectedId);
    if(!el) return;
    drag = { type:'resize', id:state.selectedId, dir:h.dataset.dir, sx:e.clientX, sy:e.clientY, ox:el.x, oy:el.y, ow:el.width, oh:el.height };
    document.addEventListener('mousemove', onDrag);
    document.addEventListener('mouseup', endDrag);
  });
});
function onDrag(e){
  if(!drag) return;
  const dx = e.clientX - drag.sx, dy = e.clientY - drag.sy;
  if(drag.type === 'move'){ updateElement(drag.id, { x: drag.ox + dx, y: drag.oy + dy }); }
  else {
    let x = drag.ox, y = drag.oy, w = drag.ow, h = drag.oh;
    const d = drag.dir;
    if(d.includes('e')) w = Math.max(30, drag.ow + dx);
    if(d.includes('s')) h = Math.max(20, drag.oh + dy);
    if(d.includes('w')){ const diff = Math.min(dx, drag.ow-30); w = drag.ow-diff; x = drag.ox+diff; }
    if(d.includes('n')){ const diff = Math.min(dy, drag.oh-20); h = drag.oh-diff; y = drag.oy+diff; }
    updateElement(drag.id, { x, y, width:w, height:h });
  }
}
function endDrag(){ if(drag) saveHistory(); drag = null; document.removeEventListener('mousemove', onDrag); document.removeEventListener('mouseup', endDrag); }

function renderTools(filter){
  filter = filter || '';
  const box = document.getElementById('tab-tools');
  const f = filter.toLowerCase().trim();
  let html = '<input type="text" class="search-box" id="tool-search" placeholder="🔎 Buscar elementos..." value="' + f.replace(/"/g,'&quot;') + '">';
  let found = false;
  LIB.forEach((cat, ci) => {
    const items = cat.items.filter(it => !f || it.label.toLowerCase().includes(f) || it.type.toLowerCase().includes(f));
    if(!items.length) return;
    found = true;
    html += '<div class="tool-cat"><div class="tool-cat-title"><i class="fa-solid fa-chevron-down arrow"></i>' + cat.cat + '</div><div class="tool-grid">';
    cat.items.forEach((it, ii) => {
      if(f && !it.label.toLowerCase().includes(f) && !it.type.toLowerCase().includes(f)) return;
      const iconClass = it.icon.startsWith('fa-brands') ? it.icon : 'fa-solid ' + it.icon;
      html += '<div class="draggable" draggable="true" data-cat="' + ci + '" data-idx="' + ii + '"><i class="' + iconClass + '"></i><span>' + it.label + '</span></div>';
    });
    html += '</div></div>';
  });
  if(!found) html += '<div class="empty-msg"><i class="fa-solid fa-magnifying-glass"></i>Sin resultados</div>';
  box.innerHTML = html;
  box.querySelectorAll('.draggable').forEach(el => {
    el.addEventListener('dragstart', e => { e.dataTransfer.setData('text/plain', JSON.stringify({ cat:parseInt(el.dataset.cat), idx:parseInt(el.dataset.idx) })); });
  });
  box.querySelectorAll('.tool-cat-title').forEach(t => {
    t.onclick = () => t.parentElement.classList.toggle('collapsed');
  });
  const s = box.querySelector('#tool-search');
  s.addEventListener('input', e => renderTools(e.target.value));
  s.addEventListener('mousedown', e => e.stopPropagation());
}

canvasWrap.addEventListener('dragleave', e => { if(!canvasWrap.contains(e.relatedTarget)) canvasWrap.classList.remove('drag-over'); });
canvasWrap.addEventListener('drop', e => {
  e.preventDefault(); e.stopPropagation(); canvasWrap.classList.remove('drag-over');
  const data = e.dataTransfer.getData('text/plain');
  if(!data) return;
  try {
    const o = JSON.parse(data);
    const item = LIB[o.cat].items[o.idx];
    const rect = canvas.getBoundingClientRect();
    const x = e.clientX - rect.left, y = e.clientY - rect.top;
    const p = defaults(item.type);
    const w = typeof p.width === 'number' ? p.width : 300;
    const h = typeof p.height === 'number' ? p.height : 80;
    addElement(item.type, Math.max(0,x-w/2), Math.max(0,y-h/2), item.props || {});
  } catch(err){ console.error(err); }
});

function renderPages(){
  const list = document.getElementById('pages-list');
  list.innerHTML = '';
  state.pages.forEach(p => {
    const item = document.createElement('div');
    item.className = 'page-item' + (p.id === state.currentPageId ? ' active' : '');
    item.innerHTML = '<span style="flex:1">' + esc(p.title) + '</span><div class="actions"><button data-act="rename" data-id="' + p.id + '"><i class="fa-solid fa-pen"></i></button>' + (state.pages.length > 1 ? '<button data-act="delete" data-id="' + p.id + '"><i class="fa-solid fa-trash"></i></button>' : '') + '</div>';
    item.querySelector('span').onclick = () => { state.currentPageId = p.id; clearSel(); renderAll(); renderPages(); applyPageBg(); };
    item.querySelectorAll('button').forEach(b => {
      b.onclick = ev => {
        ev.stopPropagation();
        if(b.dataset.act === 'rename'){ const n = prompt('Nuevo nombre:', p.title); if(n && n.trim()){ p.title = n.trim(); p.slug = slugify(n.trim()); saveHistory(); renderPages(); } }
        else if(b.dataset.act === 'delete'){
          if(!confirm('¿Eliminar la página "' + p.title + '"?')) return;
          state.pages = state.pages.filter(x => x.id !== p.id);
          if(state.currentPageId === p.id) state.currentPageId = state.pages[0].id;
          clearSel(); saveHistory(); renderAll(); renderPages(); applyPageBg();
        }
      };
    });
    list.appendChild(item);
  });
}

function buildBorderControl(el){
  const container = document.createElement('div');
  container.className = 'cg';
  container.innerHTML = '<label class="cl">🎨 Borde</label>';

  const row1 = document.createElement('div');
  row1.style.cssText = 'display:flex;gap:8px;margin-bottom:8px';
  const styleSelect = document.createElement('select');
  styleSelect.className = 'ci'; styleSelect.style.flex = '1.5';
  [
    {v:'none', l:'Sin borde'},{v:'solid', l:'─── Sólido'},{v:'dashed', l:'- - - Guiones'},
    {v:'dotted', l:'··· Puntos'},{v:'double', l:'═══ Doble'},{v:'groove', l:'┌─┐ Groove'},
    {v:'ridge', l:'┏━┓ Ridge'},{v:'inset', l:'▣ Inset'},{v:'outset', l:'▢ Outset'}
  ].forEach(o => {
    const opt = document.createElement('option');
    opt.value = o.v; opt.textContent = o.l;
    if(o.v === (el.borderStyle || 'none')) opt.selected = true;
    styleSelect.appendChild(opt);
  });
  const widthInput = document.createElement('input');
  widthInput.type = 'number'; widthInput.className = 'ci'; widthInput.style.flex = '1';
  widthInput.min = 0; widthInput.max = 20;
  widthInput.value = el.borderWidth || 0; widthInput.placeholder = 'px';
  row1.appendChild(styleSelect); row1.appendChild(widthInput);
  container.appendChild(row1);

  const row2 = document.createElement('div');
  row2.style.cssText = 'display:flex;gap:8px;align-items:center';
  row2.innerHTML = '<label style="font-size:11px;color:#6b7280;font-weight:600;white-space:nowrap">Color:</label>';
  const colorPicker = document.createElement('input'); colorPicker.type = 'color';
  colorPicker.value = (el.borderColor && el.borderColor.startsWith('#')) ? el.borderColor.substring(0,7) : '#e5e7eb';
  colorPicker.style.cssText = 'width:36px;height:32px;padding:0;border:1px solid #e5e7eb;border-radius:6px;cursor:pointer';
  const colorText = document.createElement('input'); colorText.type = 'text'; colorText.className = 'ci';
  colorText.value = el.borderColor || '#e5e7eb'; colorText.style.flex = '1';
  colorPicker.oninput = e => { colorText.value = e.target.value; updateElement(state.selectedId, { borderColor: e.target.value }); updateBorderPreview(); };
  colorPicker.onchange = () => saveHistory();
  colorText.onchange = e => { colorPicker.value = e.target.value.startsWith('#') ? e.target.value : '#e5e7eb'; updateElement(state.selectedId, { borderColor: e.target.value }); updateBorderPreview(); saveHistory(); };
  row2.appendChild(colorPicker); row2.appendChild(colorText);
  container.appendChild(row2);

  const preview = document.createElement('div');
  preview.className = 'border-preview';
  preview.textContent = 'Vista previa';
  container.appendChild(preview);

  const clearBtn = document.createElement('button');
  clearBtn.className = 'btn-s';
  clearBtn.style.cssText = 'width:100%;margin-top:6px;font-size:12px;padding:6px;background:#fef2f2;color:#dc2626';
  clearBtn.innerHTML = '<i class="fa-solid fa-xmark"></i> Quitar borde';
  clearBtn.onclick = () => {
    styleSelect.value = 'none'; widthInput.value = 0;
    updateElement(state.selectedId, { borderStyle:'none', borderWidth:0 });
    updateBorderPreview(); saveHistory();
  };
  container.appendChild(clearBtn);

  function updateBorderPreview(){
    const st = styleSelect.value;
    const w = parseInt(widthInput.value) || 0;
    const c = colorText.value;
    preview.style.borderStyle = st;
    preview.style.borderWidth = (st === 'none' ? 0 : Math.max(1, Math.min(w, 8))) + 'px';
    preview.style.borderColor = c;

  styleSelect.onchange = e => { updateElement(state.selectedId, { borderStyle: e.target.value }); updateBorderPreview(); saveHistory(); };
  widthInput.onchange = e => { updateElement(state.selectedId, { borderWidth: parseInt(e.target.value) || 0 }); updateBorderPreview(); saveHistory(); };
  updateBorderPreview();
  return container;
}

function secH(text){ const h = document.createElement('h4'); h.className = 'sec-h'; h.innerText = text; return h; }
function row(cs){ const d = document.createElement('div'); d.className = 'crow'; cs.forEach(c => d.appendChild(c)); return d; }
function inp(type, label, value, onChange){
  const w = document.createElement('div'); w.className = 'cg'; w.style.flex = '1';
  w.innerHTML = '<label class="cl">' + label + '</label>';
  const i = document.createElement('input'); i.type = type; i.value = value !== undefined ? value : ''; i.className = 'ci';
  i.onchange = e => { onChange(e.target.value); saveHistory(); }; w.appendChild(i); return w;
}
function textar(label, value, onChange){
  const w = document.createElement('div'); w.className = 'cg';
  w.innerHTML = '<label class="cl">' + label + '</label>';
  const t = document.createElement('textarea'); t.value = value !== undefined ? value : ''; t.className = 'ci'; t.rows = 4;
  t.onchange = e => { onChange(e.target.value); saveHistory(); }; w.appendChild(t); return w;
}
function colInp(label, value, onChange){
  const safe = (typeof value === 'string') ? value : '#ffffff';
  const w = document.createElement('div'); w.className = 'cg'; w.style.flex = '1';
  w.innerHTML = '<label class="cl">' + label + '</label>';
  const flex = document.createElement('div'); flex.style.cssText = 'display:flex;gap:8px;align-items:center';
  const cp = document.createElement('input'); cp.type = 'color'; cp.value = safe.startsWith('#') ? safe.substring(0,7) : '#ffffff';
  cp.style.cssText = 'width:28px;height:28px;padding:0;border:none;border-radius:4px;cursor:pointer';
  const ti = document.createElement('input'); ti.type = 'text'; ti.value = safe; ti.className = 'ci'; ti.style.flex = '1';
  cp.oninput = e => { ti.value = e.target.value; onChange(e.target.value); };
  cp.onchange = () => saveHistory();
  ti.onchange = e => { cp.value = e.target.value.startsWith('#') ? e.target.value : '#ffffff'; onChange(e.target.value); saveHistory(); };
  flex.appendChild(cp); flex.appendChild(ti); w.appendChild(flex); return w;
}
function sel(label, value, options, onChange){
  const w = document.createElement('div'); w.className = 'cg';
  w.innerHTML = '<label class="cl">' + label + '</label>';
  const s = document.createElement('select'); s.className = 'ci';
  options.forEach(opt => { const o = document.createElement('option'); o.value = opt.value; o.innerText = opt.label; if(String(opt.value) === String(value)) o.selected = true; s.appendChild(o); });
  s.onchange = e => { onChange(e.target.value); saveHistory(); }; w.appendChild(s); return w;
}
function chk(label, checked, onChange){
  const w = document.createElement('div'); w.className = 'chk-row';
  w.innerHTML = '<label>' + label + '</label>';
  const i = document.createElement('input'); i.type = 'checkbox'; i.checked = !!checked;
  i.onchange = e => { onChange(e.target.checked); saveHistory(); }; w.appendChild(i); return w;
}

/* ========== EXPORTAR ========== */
document.getElementById('btn-export').onclick = () => {
  const page = getPage();
  const pageBg = page.bgColor || '#ffffff';
  const isGrad = isGradient(pageBg);
  const editorCSS = document.querySelector('style').innerHTML;

  let elementsHTML = '';
  page.elements.forEach(el => {
    const border = buildBorder(el);
    const bgCSS = isGradient(el.bgColor) ? `background:${el.bgColor};` : `background:${(el.bgColor && el.type !== 'code') ? el.bgColor : 'transparent'};`;
    const baseStyle = `position:absolute;left:${el.x}px;top:${el.y}px;width:${typeof el.width==='number'?el.width+'px':el.width};height:${typeof el.height==='number'?el.height+'px':el.height};z-index:${el.zIndex};opacity:${el.opacity};border-radius:${el.borderRadius||0}px;box-shadow:${el.boxShadow||'none'};border:${border};${bgCSS}box-sizing:border-box;`;
    const dom = document.getElementById(el.id);
    let inner = '';
    if(dom){
      const clone = dom.cloneNode(true);
      inner = clone.innerHTML;
    }
    elementsHTML += `<div class="elemento" style="${baseStyle}">${inner}</div>\n`;
  });

  const scriptsHTML = `<script>
document.querySelectorAll('.carousel').forEach(function(c){
  var i = 0;
  var slides = c.querySelectorAll('.carousel-slide');
  var dots = c.querySelectorAll('.carousel-dot');
  if(!slides.length) return;
  function update(n){
    i = (n + slides.length) % slides.length;
    slides.forEach(function(s,x){ s.classList.remove('active'); s.style.opacity = x === i ? '1' : '0'; });
    slides[i].classList.add('active');
    dots.forEach(function(d,x){ d.classList.toggle('active', x === i); });
  }
  var p = c.querySelector('.prev'), nx = c.querySelector('.next');
  if(p) p.onclick = function(e){ e.stopPropagation(); update(i-1); };
  if(nx) nx.onclick = function(e){ e.stopPropagation(); update(i+1); };
  dots.forEach(function(d,x){ d.onclick = function(e){ e.stopPropagation(); update(x); }; });
  if(c.getAttribute('data-autoplay') === 'true'){ setInterval(function(){ update(i+1); }, parseInt(c.getAttribute('data-interval') || '3000')); }
});
document.querySelectorAll('.gallery-wrap').forEach(function(w){
  var track = w.querySelector('.gallery-track');
  var items = track ? track.querySelectorAll('.gallery-item') : [];
  var dots = w.querySelectorAll('.gallery-dot');
  if(!items.length) return;
  var pv = parseInt(w.getAttribute('data-perview') || '3');
  var gap = parseInt(w.getAttribute('data-gap') || '8');
  var pages = Math.max(1, Math.ceil(items.length / pv));
  var pg = 0;
  function update(){ var iw = items[0].getBoundingClientRect().width; track.style.transform = 'translateX(-' + (pg * pv * (iw + gap)) + 'px)'; dots.forEach(function(d,x){ d.classList.toggle('active', x === pg); }); }
  var p = w.querySelector('.gallery-arrow.prev'), nx = w.querySelector('.gallery-arrow.next');
  function go(n){ pg = (n + pages) % pages; update(); }
  if(p) p.onclick = function(e){ e.stopPropagation(); go(pg-1); };
  if(nx) nx.onclick = function(e){ e.stopPropagation(); go(pg+1); };
  dots.forEach(function(d,x){ d.onclick = function(e){ e.stopPropagation(); pg = x; update(); }; });
  window.addEventListener('resize', update); setTimeout(update, 50);
  if(w.getAttribute('data-autoplay') === 'true' && pages > 1){ setInterval(function(){ go(pg+1); }, parseInt(w.getAttribute('data-interval') || '2500')); }
});
document.querySelectorAll('.cardcar-wrap').forEach(function(w){
  var track = w.querySelector('.cardcar-track');
  var items = track ? track.querySelectorAll('.cardcar-item') : [];
  var dots = w.querySelectorAll('.cardcar-dot');
  if(!items.length) return;
  var pv = parseInt(w.getAttribute('data-perview') || '3');
  var gap = parseInt(w.getAttribute('data-gap') || '16');
  var pages = Math.max(1, Math.ceil(items.length / pv));
  var pg = 0;
  function update(){ var iw = items[0].getBoundingClientRect().width; track.style.transform = 'translateX(-' + (pg * pv * (iw + gap)) + 'px)'; dots.forEach(function(d,x){ d.classList.toggle('active', x === pg); }); }
  var p = w.querySelector('.cardcar-arrow.prev'), nx = w.querySelector('.cardcar-arrow.next');
  function go(n){ pg = (n + pages) % pages; update(); }
  if(p) p.onclick = function(e){ e.stopPropagation(); go(pg-1); };
  if(nx) nx.onclick = function(e){ e.stopPropagation(); go(pg+1); };
  dots.forEach(function(d,x){ d.onclick = function(e){ e.stopPropagation(); pg = x; update(); }; });
  window.addEventListener('resize', update); setTimeout(update, 50);
  if(w.getAttribute('data-autoplay') === 'true' && pages > 1){ setInterval(function(){ go(pg+1); }, parseInt(w.getAttribute('data-interval') || '3000')); }
});
</scr` + `ipt>`;

  const finalHTML = `<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>${esc(page.title)}</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<style>
body{margin:0;font-family:'Inter',system-ui,sans-serif;color:#1f2937;background:${isGrad ? '#f3f4f6' : pageBg};}
.page-container{position:relative;width:100%;max-width:1200px;margin:0 auto;min-height:100vh;background:${pageBg};}
.elemento{position:absolute;box-sizing:border-box;word-break:break-word}
${editorCSS}
</style>
</head>
<body>
<div class="page-container">
${elementsHTML}
</div>
${scriptsHTML}
</body>
</html>`;

  const blob = new Blob([finalHTML], { type: 'text/html;charset=utf-8' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = (page.slug || 'index') + '.html';
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);

  setTimeout(() => alert('✅ Exportado: ' + (page.slug || 'index') + '.html'), 200);
};
