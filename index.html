<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Constructor Web Visual Pro</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<style>
:root{--bg:#f3f4f6;--primary:#3b82f6;--primary-h:#2563eb;--border:#e5e7eb;--text:#1f2937;--muted:#6b7280;--sb:380px;--tb:60px}
*{box-sizing:border-box}
body{margin:0;overflow:hidden;font-family:'Inter',system-ui,sans-serif;background:var(--bg);color:var(--text);display:flex;flex-direction:column;height:100vh}
.topbar{height:var(--tb);background:#fff;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;padding:0 20px;z-index:100;box-shadow:0 1px 3px rgba(0,0,0,.05)}
.vp-btn{padding:8px 12px;border-radius:6px;color:var(--muted);cursor:pointer;border:none;background:transparent}
.vp-btn.active{background:#eff6ff;color:var(--primary)}
.workspace{display:flex;flex:1;height:calc(100vh - var(--tb));overflow:hidden}
.canvas-wrap{flex:1;overflow:auto;display:flex;justify-content:center;padding:40px;background:#e5e5f7;background-image:radial-gradient(#cbd5e1 1px,transparent 1px);background-size:20px 20px}
.canvas{background:#fff;box-shadow:0 10px 25px rgba(0,0,0,.1);position:relative;min-height:1400px;width:1200px;align-self:flex-start;transition:width .3s}
.canvas.tablet{width:768px}.canvas.mobile{width:375px}
.sidebar{width:var(--sb);background:#fff;border-left:1px solid var(--border);display:flex;flex-direction:column;z-index:100}
.tabs{display:flex;border-bottom:1px solid var(--border)}
.tab{flex:1;padding:12px 0;text-align:center;font-weight:500;font-size:13px;cursor:pointer;border-bottom:2px solid transparent;color:var(--muted);background:none;border:none}
.tab.active{border-bottom-color:var(--primary);color:var(--primary)}
.scontent{flex:1;overflow-y:auto;padding:16px}
.search-box{width:100%;padding:8px 12px;border:1px solid var(--border);border-radius:8px;font-size:13px;outline:none;margin-bottom:12px;font-family:inherit}
.search-box:focus{border-color:var(--primary);box-shadow:0 0 0 2px rgba(59,130,246,.15)}
.tool-cat{margin-bottom:14px}
.tool-cat-title{font-size:10px;font-weight:700;color:#9ca3af;text-transform:uppercase;letter-spacing:.5px;margin-bottom:6px}
.tool-grid{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.draggable{border:1px solid var(--border);border-radius:8px;padding:9px 10px;cursor:grab;display:flex;align-items:center;gap:8px;background:#fff;font-size:12px;user-select:none}
.draggable:hover{border-color:var(--primary);box-shadow:0 2px 5px rgba(59,130,246,.15)}
.draggable:active{cursor:grabbing}
.draggable i{color:var(--primary);font-size:13px;width:14px;text-align:center;flex-shrink:0}
.draggable span{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.elemento{position:absolute;box-sizing:border-box;cursor:move;user-select:none;word-break:break-word}
#sel-box{position:absolute;border:2px solid var(--primary);pointer-events:none;z-index:9999;display:none}
.rh{position:absolute;width:10px;height:10px;background:#fff;border:2px solid var(--primary);border-radius:50%;pointer-events:auto}
.rh-nw{top:-6px;left:-6px;cursor:nwse-resize}.rh-ne{top:-6px;right:-6px;cursor:nesw-resize}
.rh-sw{bottom:-6px;left:-6px;cursor:nesw-resize}.rh-se{bottom:-6px;right:-6px;cursor:nwse-resize}
.rh-n{top:-6px;left:calc(50% - 5px);cursor:ns-resize}.rh-s{bottom:-6px;left:calc(50% - 5px);cursor:ns-resize}
.rh-e{top:calc(50% - 5px);right:-6px;cursor:ew-resize}.rh-w{top:calc(50% - 5px);left:-6px;cursor:ew-resize}
.cg{margin-bottom:12px}
.cl{display:block;font-size:11px;font-weight:600;margin-bottom:5px;color:var(--muted);text-transform:uppercase;letter-spacing:.5px}
.ci{width:100%;padding:7px 10px;border:1px solid var(--border);border-radius:6px;font-size:13px;outline:none;font-family:inherit;background:#fff}
.ci:focus{border-color:var(--primary);box-shadow:0 0 0 2px rgba(59,130,246,.15)}
.crow{display:flex;gap:10px}
.sec-h{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.5px;color:#9ca3af;margin:16px 0 8px;padding-bottom:4px;border-bottom:1px solid var(--border)}
.sec-h:first-child{margin-top:0}
.hidden{display:none!important}
.btn-p{background:#3b82f6;color:#fff;border:none;padding:8px 16px;border-radius:6px;cursor:pointer;font-weight:500;font-size:13px}
.btn-p:hover{background:#2563eb}
.btn-s{background:#eff6ff;color:#2563eb;border:none;padding:8px 16px;border-radius:6px;cursor:pointer;font-weight:500;font-size:13px}
.btn-s:hover{background:#dbeafe}
.chk-row{display:flex;align-items:center;justify-content:space-between;margin:8px 0}
.chk-row label{font-size:11px;font-weight:600;color:var(--muted);text-transform:uppercase;cursor:pointer}
.chk-row input{width:16px;height:16px;cursor:pointer}
.empty-msg{text-align:center;color:#9ca3af;padding:40px 20px;font-size:13px}
.empty-msg i{font-size:28px;margin-bottom:10px;display:block}
.page-item{display:flex;align-items:center;justify-content:space-between;padding:8px 12px;border-radius:8px;font-size:13px;margin-bottom:6px;border:1px solid var(--border);background:#fff;cursor:pointer}
.page-item.active{border-color:var(--primary);background:#eff6ff;color:#1d4ed8;font-weight:600}
.page-item .actions{display:flex;gap:4px;opacity:.3;transition:opacity .2s}
.page-item:hover .actions{opacity:1}
.page-item .actions button{background:none;border:none;color:#9ca3af;cursor:pointer;padding:3px 5px;border-radius:4px;font-size:11px}
.canvas-wrap.drag-over .canvas{outline:2px dashed var(--primary);outline-offset:-2px}
/* Estilos elementos HTML reales */
.e-btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:10px 20px;border:none;border-radius:8px;cursor:pointer;font-size:15px;text-decoration:none;font-family:inherit}
.e-img{width:100%;height:100%;object-fit:cover;display:block;border-radius:inherit}
.e-video,.e-audio{width:100%;border-radius:inherit}
.e-iframe{width:100%;height:100%;border:none;border-radius:inherit}
.e-form{display:flex;flex-direction:column;gap:10px}
.e-input{width:100%;padding:9px 12px;border:1px solid #d1d5db;border-radius:6px;font-size:14px;font-family:inherit;outline:none}
.e-input:focus{border-color:var(--primary);box-shadow:0 0 0 2px rgba(59,130,246,.15)}
.e-label{font-size:12px;font-weight:600;color:#374151;margin-bottom:3px;display:block}
.e-details{border:1px solid #e5e7eb;border-radius:8px;overflow:hidden}
.e-details summary{padding:12px 16px;cursor:pointer;background:#f9fafb;font-weight:600;list-style:none;position:relative;padding-right:36px}
.e-details summary::-webkit-details-marker{display:none}
.e-details summary::after{content:'+';position:absolute;right:16px;font-size:20px;color:var(--primary)}
.e-details[open] summary::after{content:'−'}
.e-details .details-content{padding:12px 16px;border-top:1px solid #e5e7eb}
.e-table{width:100%;border-collapse:collapse}
.e-table th,.e-table td{border:1px solid #e5e7eb;padding:8px 12px;text-align:left}
.e-table th{background:#f9fafb;font-weight:600}
.e-progress{width:100%;height:20px;background:#e5e7eb;border-radius:10px;overflow:hidden}
.e-progress-bar{height:100%;background:var(--primary);display:flex;align-items:center;justify-content:center;color:#fff;font-size:11px;font-weight:600}
.e-badge{display:inline-block;padding:3px 10px;border-radius:20px;font-size:12px;font-weight:600}
.e-alert{padding:12px 16px;border-radius:8px;border-left:4px solid;font-size:14px;display:flex;gap:10px;align-items:flex-start}
.e-alert-info{background:#eff6ff;border-color:#3b82f6;color:#1e40af}
.e-alert-success{background:#f0fdf4;border-color:#10b981;color:#065f46}
.e-alert-warning{background:#fffbeb;border-color:#f59e0b;color:#92400e}
.e-alert-danger{background:#fef2f2;border-color:#ef4444;color:#991b1b}
.e-code{background:#1e293b;color:#e2e8f0;padding:14px 16px;border-radius:8px;font-family:'Courier New',monospace;font-size:13px;overflow-x:auto;white-space:pre;margin:0}
.e-blockquote{border-left:4px solid var(--primary);padding:10px 16px;margin:0;background:#f9fafb;font-style:italic;color:#4b5563;border-radius:0 8px 8px 0}
.e-card{background:#fff;border:1px solid #e5e7eb;border-radius:12px;overflow:hidden;box-shadow:0 1px 3px rgba(0,0,0,.05);height:100%}
.e-card img{width:100%;height:160px;object-fit:cover}
.e-card .card-body{padding:14px}
.e-card .card-title{font-weight:700;font-size:16px;margin:0 0 6px}
.e-card .card-text{color:#6b7280;font-size:13px;margin:0 0 12px}
.e-list{padding-left:24px;margin:0}
.e-list li{margin-bottom:4px}
.e-divider{border:none;border-top:2px solid #e5e7eb;margin:8px 0;width:100%}
.e-counter{font-size:48px;font-weight:700;text-align:center;color:var(--primary)}
</style>
</head>
<body>

<header class="topbar">
  <div style="display:flex;align-items:center;gap:12px">
    <i class="fa-solid fa-cube" style="color:#3b82f6;font-size:20px"></i>
    <input type="text" id="proj-title" value="Mi Proyecto Web" style="font-weight:bold;font-size:15px;border:none;outline:none;padding:4px 8px;width:180px">
  </div>
  <div style="display:flex;gap:8px;background:#f3f4f6;padding:4px;border-radius:8px">
    <button class="vp-btn active" data-view="desktop" title="Escritorio"><i class="fa-solid fa-desktop"></i></button>
    <button class="vp-btn" data-view="tablet" title="Tablet"><i class="fa-solid fa-tablet-screen-button"></i></button>
    <button class="vp-btn" data-view="mobile" title="Móvil"><i class="fa-solid fa-mobile-screen-button"></i></button>
  </div>
  <div style="display:flex;gap:8px">
    <button id="btn-undo" style="background:none;border:none;padding:8px;color:#6b7280;cursor:pointer" title="Deshacer (Ctrl+Z)"><i class="fa-solid fa-rotate-left"></i></button>
    <button id="btn-redo" style="background:none;border:none;padding:8px;color:#6b7280;cursor:pointer" title="Rehacer (Ctrl+Y)"><i class="fa-solid fa-rotate-right"></i></button>
    <button id="btn-export" class="btn-p"><i class="fa-solid fa-download" style="margin-right:6px"></i>Exportar Sitio</button>
  </div>
</header>

<main class="workspace">
  <div class="canvas-wrap" id="canvas-wrap">
    <div class="canvas" id="canvas">
      <div id="sel-box">
        <div class="rh rh-nw" data-dir="nw"></div><div class="rh rh-n" data-dir="n"></div><div class="rh rh-ne" data-dir="ne"></div>
        <div class="rh rh-w" data-dir="w"></div><div class="rh rh-e" data-dir="e"></div>
        <div class="rh rh-sw" data-dir="sw"></div><div class="rh rh-s" data-dir="s"></div><div class="rh rh-se" data-dir="se"></div>
      </div>
    </div>
  </div>
  <aside class="sidebar">
    <div class="tabs">
      <button class="tab active" data-tab="tools">🧩 Elementos</button>
      <button class="tab" data-tab="pages">📄 Páginas</button>
      <button class="tab" data-tab="props">⚙️ Propiedades</button>
    </div>
    <div id="tab-tools" class="scontent"></div>
    <div id="tab-pages" class="scontent hidden">
      <h3 class="sec-h" style="margin-top:0">Páginas del sitio</h3>
      <div id="pages-list"></div>
      <button id="btn-add-page" class="btn-s" style="width:100%;margin-top:8px"><i class="fa-solid fa-plus" style="margin-right:6px"></i>Nueva Página</button>
    </div>
    <div id="tab-props" class="scontent hidden">
      <div id="no-sel" class="empty-msg">
        <i class="fa-solid fa-computer-mouse"></i>
        Selecciona un elemento para editar sus propiedades
      </div>
      <div id="props-panel" class="hidden"></div>
    </div>
  </aside>
</main>

<script>
/* ========== ESTADO ========== */
const state = {
  viewport:'desktop',
  currentPageId:'home',
  pages:[{id:'home',title:'Inicio',slug:'index',elements:[]}],
  selectedId:null,
  history:[],
  historyIndex:-1
};
const canvas = document.getElementById('canvas');
const canvasWrap = document.getElementById('canvas-wrap');
const selBox = document.getElementById('sel-box');
const tabBtns = document.querySelectorAll('.tab');
const tabContents = {
  tools:document.getElementById('tab-tools'),
  pages:document.getElementById('tab-pages'),
  props:document.getElementById('tab-props')
};
const propsPanel = document.getElementById('props-panel');
const noSel = document.getElementById('no-sel');

const uid = () => 'el_'+Math.random().toString(36).substr(2,9);
const slugify = t => t.toString().toLowerCase().replace(/\s+/g,'-').replace(/[^\w\-]+/g,'').replace(/\-\-+/g,'-').replace(/^-+|-+$/g,'') || 'pagina';
const getPage = () => state.pages.find(p => p.id === state.currentPageId);
const getElements = () => getPage()?.elements || [];

/* ========== HISTORIAL ========== */
const saveHistory = () => {
  const s = JSON.stringify(state.pages);
  state.history = state.history.slice(0, state.historyIndex+1);
  state.history.push(s);
  state.historyIndex++;
};
const undo = () => {
  if(state.historyIndex > 0){
    state.historyIndex--;
    state.pages = JSON.parse(state.history[state.historyIndex]);
    clearSel(); renderAll(); renderPages();
  }
};
const redo = () => {
  if(state.historyIndex < state.history.length-1){
    state.historyIndex++;
    state.pages = JSON.parse(state.history[state.historyIndex]);
    clearSel(); renderAll(); renderPages();
  }
};
document.getElementById('btn-undo').onclick = undo;
document.getElementById('btn-redo').onclick = redo;
document.addEventListener('keydown', e => {
  if((e.ctrlKey||e.metaKey) && e.key === 'z'){ e.shiftKey?redo():undo(); e.preventDefault(); }
  else if((e.ctrlKey||e.metaKey) && e.key === 'y'){ redo(); e.preventDefault(); }
  else if((e.key==='Delete'||e.key==='Backspace') && state.selectedId){
    if(e.target.tagName!=='INPUT' && e.target.tagName!=='TEXTAREA' && !e.target.isContentEditable){
      deleteEl(state.selectedId);
    }
  }
});

/* ========== BIBLIOTECA ========== */
const LIB = [
  { cat:'📝 Texto', items:[
    { type:'heading', label:'Título H1', icon:'fa-heading', props:{ text:'Título Principal', level:1, fontSize:32 }},

    { type:'list', label:'Lista puntos', icon:'fa-list-ul', props:{ items:['Elemento 1','Elemento 2','Elemento 3'], ordered:false }},
    { type:'list', label:'Lista números', icon:'fa-list-ol', props:{ items:['Primero','Segundo','Tercero'], ordered:true }},
    { type:'badge', label:'Etiqueta', icon:'fa-tag', props:{ text:'Nuevo' }}
  ]},
  { cat:'🔗 Enlaces y Botones', items:[

    { type:'button', label:'Botón', icon:'fa-square', props:{ text:'Haz clic', href:'', bgColor:'#3b82f6', color:'#ffffff' }},

  ]},

    { type:'image', label:'Imagen enlace', icon:'fa-external-link-alt', props:{ src:'https://placehold.co/600x400/ef4444/fff?text=Enlace', href:'https://google.com' }},

  ]},
  { cat:'🎥 Multimedia', items:[
    { type:'video', label:'Vídeo', icon:'fa-video', props:{ src:'https://www.w3schools.com/html/mov_bbb.mp4', controls:true }},
    { type:'audio', label:'Audio', icon:'fa-music', props:{ src:'https://www.w3schools.com/html/horse.mp3', controls:true }},
    { type:'iframe', label:'YouTube', icon:'fa-youtube', props:{ src:'https://www.youtube.com/embed/dQw4w9WgXcQ' }},

  { cat:'📋 Formularios', items:[

      { type:'text', label:'Nombre', placeholder:'Tu nombre', required:true },

    { type:'card', label:'Card completa', icon:'fa-address-card', props:{ title:'Título', text:'Descripción breve', img:'https://placehold.co/400x200/3b82f6/fff?text=Card', buttonText:'Ver más' }},

  ]},

    { type:'social', label:'YouTube', icon:'fa-youtube', props:{ icon:'fa-brands fa-youtube', url:'https://youtube.com', color:'#ff0000' }},
    { type:'social', label:'X (Twitter)', icon:'fa-x-twitter', props:{ icon:'fa-brands fa-x-twitter', url:'https://x.com', color:'#000000' }},
    { type:'social', label:'GitHub', icon:'fa-github', props:{ icon:'fa-brands fa-github', url:'https://github.com', color:'#333333' }},

/* ========== DEFAULTS ========== */
function defaults(type){
  const base = { x:60,y:60,width:300,height:80,zIndex:1,opacity:1,borderRadius:0,boxShadow:'none',border:'none',bgColor:'transparent',padding:'0' };
  const d = {
    heading:{ width:500,height:60,text:'Título Principal',level:1,fontSize:32,fontWeight:'bold',color:'#1f2937',textAlign:'left' },
    paragraph:{ width:450,height:60,text:'Escribe tu párrafo aquí.',fontSize:16,color:'#374151',textAlign:'left' },
    blockquote:{ width:450,height:80,text:'Una cita inspiradora.',fontSize:16,color:'#4b5563' },
    code:{ width:450,height:100,text:'const saludo = "Hola";',fontSize:13 },
    list:{ width:300,height:120,items:['Elemento 1','Elemento 2','Elemento 3'],ordered:false,fontSize:15,color:'#374151' },

/* ========== CRUD ========== */
function addElement(type, x, y, extra = {}){
  const props = defaults(type);
  const el = { id:uid(), type, x:Math.max(0,x), y:Math.max(0,y), ...props, ...extra };
  getElements().push(el);
  saveHistory();
  renderElement(el);
  selectElement(el.id);
}
function updateElement(id, updates){
  const el = getElements().find(e => e.id === id);
  if(!el) return;
  Object.assign(el, updates);
  const dom = document.getElementById(id);
  if(dom) syncDOM(dom, el);
  if(state.selectedId === id) updateSelBox();
}
function deleteEl(id){
  const page = getPage();
  if(!page) return;
  page.elements = page.elements.filter(e => e.id !== id);
  document.getElementById(id)?.remove();
  clearSel();
  saveHistory();
}

/* ========== RENDER ELEMENTOS ========== */
function renderAll(){
  canvas.querySelectorAll('.elemento').forEach(n => n.remove());
  getElements().forEach(renderElement);
  updateSelBox();
}
function renderElement(el){
  let dom = document.getElementById(el.id);
  if(!dom){
    dom = document.createElement('div');
    dom.id = el.id;
    dom.className = 'elemento';
    dom.addEventListener('dblclick', e => {
      if(['heading','paragraph','blockquote','code','badge','button','link'].includes(el.type)){
        const t = dom.querySelector('h1,h2,h3,h4,h5,h6,p,blockquote,pre,span,a,button') || dom;
        t.contentEditable = true;
        t.focus();
        t.style.cursor = 'text';
        e.stopPropagation();
      }
    });
    dom.addEventListener('blur', e => {
      if(e.target.isContentEditable){
        e.target.contentEditable = false;
        e.target.style.cursor = '';
        updateElement(el.id, { text: e.target.innerText });
        saveHistory();
      }
    }, true);
    dom.addEventListener('mousedown', e => {
      if(e.target.isContentEditable) return;
      e.stopPropagation();
      selectElement(el.id);
      startDrag(e, el.id);
    });
    canvas.appendChild(dom);
  }
  syncDOM(dom, el);
}

function syncDOM(dom, el){
  Object.assign(dom.style, {
    left: el.x+'px',
    top: el.y+'px',
    width: typeof el.width==='number' ? el.width+'px' : el.width,
    height: typeof el.height==='number' ? el.height+'px' : el.height,
    zIndex: el.zIndex,
    opacity: el.opacity,
    borderRadius: (el.borderRadius||0)+'px',
    boxShadow: el.boxShadow||'none',
    border: el.border||'none',
    backgroundColor: el.bgColor||'transparent',
    padding: el.padding||'0'
  });
  const T = el.type;
  let html = '';
  if(T === 'heading') html = `<h${el.level} style="margin:0;font-size:${el.fontSize}px;font-weight:${el.fontWeight};color:${el.color};text-align:${el.textAlign}">${esc(el.text)}</h${el.level}>`;
  else if(T === 'paragraph') html = `<p style="margin:0;font-size:${el.fontSize}px;color:${el.color};text-align:${el.textAlign};line-height:1.5">${esc(el.text)}</p>`;
  else if(T === 'blockquote') html = `<blockquote class="e-blockquote" style="font-size:${el.fontSize}px;color:${el.color}">${esc(el.text)}</blockquote>`;
  else if(T === 'code') html = `<pre class="e-code" style="font-size:${el.fontSize}px">${esc(el.text)}</pre>`;
  else if(T === 'list') html = `<ul class="e-list" style="font-size:${el.fontSize}px;color:${el.color};list-style:${el.ordered?'decimal':'disc'}">${el.items.map(i=>`<li>${esc(i)}</li>`).join('')}</ul>`;
  else if(T === 'badge') html = `<span class="e-badge" style="font-size:${el.fontSize}px;color:${el.color};background:${el.bgColor}">${esc(el.text)}</span>`;
  else if(T === 'link') html = `<a href="${el.href||'#'}" target="${el.target||'_self'}" style="font-size:${el.fontSize}px;color:${el.color};text-decoration:underline">${esc(el.text)}</a>`;
  else if(T === 'button'){
    const ic = el.icon ? `<i class="fa-solid ${el.icon}"></i>` : '';
    if(el.download && el.href) html = `<a href="${el.href}" download class="e-btn" style="background:${el.bgColor};color:${el.color};font-size:${el.fontSize}px">${ic}${esc(el.text)}</a>`;
    else if(el.href) html = `<a href="${el.href}" class="e-btn" style="background:${el.bgColor};color:${el.color};font-size:${el.fontSize}px">${ic}${esc(el.text)}</a>`;
    else html = `<button class="e-btn" type="button" style="background:${el.bgColor};color:${el.color};font-size:${el.fontSize}px">${ic}${esc(el.text)}</button>`;
  }
  else if(T === 'image'){
    const img = `<img src="${el.src}" alt="${el.alt||''}" class="e-img" style="object-fit:${el.objectFit||'cover'}" draggable="false">`;
    html = el.href ? `<a href="${el.href}" target="_blank" style="display:block;width:100%;height:100%;pointer-events:none">${img}</a>` : img;
  }
  else if(T === 'video') html = `<video class="e-video" src="${el.src}" ${el.controls?'controls':''} ${el.autoplay?'autoplay':''} ${el.loop?'loop':''} ${el.muted?'muted':''} style="width:100%;height:100%"></video>`;
  else if(T === 'audio') html = `<audio class="e-audio" src="${el.src}" ${el.controls?'controls':''} style="width:100%"></audio>`;
  else if(T === 'iframe') html = `<iframe class="e-iframe" src="${el.src}" allowfullscreen loading="lazy"></iframe>`;
  else if(T === 'form'){
    const f = (el.fields||[]).map(x => {
      const req = x.required ? 'required' : '';
      if(x.type === 'textarea') return `<div><label class="e-label">${esc(x.label||'')}</label><textarea class="e-input" placeholder="${esc(x.placeholder||'')}" rows="3" ${req}></textarea></div>`;
      return `<div><label class="e-label">${esc(x.label||'')}</label><input type="${x.type||'text'}" class="e-input" placeholder="${esc(x.placeholder||'')}" ${req}></div>`;
    }).join('');
    html = `<form class="e-form" onsubmit="event.preventDefault();alert('Formulario enviado')">${f}<button type="submit" class="e-btn" style="background:#3b82f6;color:#fff">${esc(el.buttonText||'Enviar')}</button></form>`;
  }
  else if(T === 'input'){
    const req = el.required ? 'required' : '';
    const val = el.value !== undefined ? `value="${el.value}"` : '';
    html = `<div><label class="e-label">${esc(el.label||'')}</label><input type="${el.inputType||'text'}" class="e-input" placeholder="${esc(el.placeholder||'')}" ${req} ${val}></div>`;
  }
  else if(T === 'select') html = `<div><label class="e-label">${esc(el.label||'')}</label><select class="e-input">${el.options.map(o=>`<option>${esc(o)}</option>`).join('')}</select></div>`;
  else if(T === 'checkbox') html = `<label style="display:flex;align-items:center;gap:8px;font-size:14px;cursor:pointer"><input type="checkbox" ${el.checked?'checked':''}> ${esc(el.label)}</label>`;
  else if(T === 'radio') html = `<label style="display:flex;align-items:center;gap:8px;font-size:14px;cursor:pointer"><input type="radio" name="${el.name}" value="${el.value}"> ${esc(el.label)}</label>`;
  else if(T === 'textarea') html = `<div><label class="e-label">${esc(el.label||'')}</label><textarea class="e-input" placeholder="${esc(el.placeholder||'')}" rows="3"></textarea></div>`;
  else if(T === 'details') html = `<details class="e-details"><summary>${esc(el.summary)}</summary><div class="details-content">${el.content}</div></details>`;
  else if(T === 'alert'){
    const ic = { info:'fa-circle-info', success:'fa-circle-check', warning:'fa-triangle-exclamation', danger:'fa-triangle-exclamation' };
    html = `<div class="e-alert e-alert-${el.alertType}"><i class="fa-solid ${ic[el.alertType]}"></i><div>${esc(el.text)}</div></div>`;
  }
  else if(T === 'progress') html = `<div class="e-progress"><div class="e-progress-bar" style="width:${(el.value/el.max*100)}%">${el.showLabel?el.value+'%':''}</div></div>`;
  else if(T === 'counter') html = `<div><div class="e-counter">${el.value}</div><div style="text-align:center;color:#6b7280;font-size:14px;margin-top:4px">${esc(el.label)}</div></div>`;
  else if(T === 'table'){
    let t = `<table class="e-table">`;
    el.rows.forEach((r,i) => {
      const tag = (i===0 && el.header) ? 'th' : 'td';
      t += `<tr>${r.map(c => `<${tag}>${esc(c)}</${tag}>`).join('')}</tr>`;
    });
    t += `</table>`;
    html = t;
  }
  else if(T === 'card') html = `<div class="e-card"><img src="${el.img}" alt=""><div class="card-body"><h3 class="card-title">${esc(el.title)}</h3><p class="card-text">${esc(el.text)}</p><a href="${el.buttonHref||'#'}" class="e-btn" style="background:#3b82f6;color:#fff;font-size:13px;padding:8px 14px">${esc(el.buttonText)}</a></div></div>`;
  else if(T === 'divider') html = `<hr class="e-divider" style="border-top-color:${el.color}">`;
  else if(T === 'icon'){
    const ih = `<i class="fa-solid ${el.icon}" style="font-size:${el.size}px;color:${el.color}"></i>`;
    html = el.href ? `<a href="${el.href}" target="_blank" style="color:inherit">${ih}</a>` : ih;
  }
  else if(T === 'social') html = `<a href="${el.url}" target="_blank" style="display:flex;align-items:center;justify-content:center;width:100%;height:100%;border-radius:${el.shape==='circle'?'50%':'8px'};background:${el.color};color:#fff;text-decoration:none"><i class="${el.icon}" style="font-size:${el.size}px"></i></a>`;
  else html = '';
  if(!dom.querySelector('[contenteditable="true"]')) dom.innerHTML = html;
}
function esc(s){ return String(s??'').replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m])); }

/* ========== SELECCIÓN ========== */
function selectElement(id){
  state.selectedId = id;
  switchTab('props');
  updateSelBox();
  renderProps();
}
function clearSel(){
  state.selectedId = null;
  selBox.style.display = 'none';
  renderProps();
}
function updateSelBox(){
  if(!state.selectedId){ selBox.style.display='none'; return; }
  const el = getElements().find(e => e.id === state.selectedId);
  if(!el){ selBox.style.display='none'; return; }
  selBox.style.display = 'block';
  selBox.style.left = el.x+'px';
  selBox.style.top = el.y+'px';
  selBox.style.width = (typeof el.width==='number'?el.width+'px':el.width);
  selBox.style.height = (typeof el.height==='number'?el.height+'px':el.height);
}
canvasWrap.addEventListener('mousedown', e => {
  if(e.target === canvasWrap || e.target === canvas) clearSel();
});

/* ========== DRAG / RESIZE ========== */
let drag = null;
function startDrag(e, id){
  if(e.target.classList.contains('rh')) return;
  const el = getElements().find(x => x.id === id);
  if(!el) return;
  drag = { type:'move', id, sx:e.clientX, sy:e.clientY, ox:el.x, oy:el.y };
  document.addEventListener('mousemove', onDrag);
  document.addEventListener('mouseup', endDrag);
}
document.querySelectorAll('.rh').forEach(h => {
  h.addEventListener('mousedown', e => {
    e.stopPropagation();
    if(!state.selectedId) return;
    const el = getElements().find(x => x.id === state.selectedId);
    if(!el) return;
    drag = { type:'resize', id:state.selectedId, dir:h.dataset.dir, sx:e.clientX, sy:e.clientY, ox:el.x, oy:el.y, ow:el.width, oh:el.height };
    document.addEventListener('mousemove', onDrag);
    document.addEventListener('mouseup', endDrag);
  });
});
function onDrag(e){
  if(!drag) return;
  const dx = e.clientX - drag.sx;
  const dy = e.clientY - drag.sy;
  if(drag.type === 'move'){
    updateElement(drag.id, { x: drag.ox + dx, y: drag.oy + dy });
  } else {
    let x = drag.ox, y = drag.oy, w = drag.ow, h = drag.oh;
    const d = drag.dir;
    if(d.includes('e')) w = Math.max(30, drag.ow + dx);
    if(d.includes('s')) h = Math.max(20, drag.oh + dy);
    if(d.includes('w')){ const diff = Math.min(dx, drag.ow-30); w = drag.ow-diff; x = drag.ox+diff; }
    if(d.includes('n')){ const diff = Math.min(dy, drag.oh-20); h = drag.oh-diff; y = drag.oy+diff; }
    updateElement(drag.id, { x, y, width:w, height:h });
  }
}
function endDrag(){
  if(drag) saveHistory();
  drag = null;
  document.removeEventListener('mousemove', onDrag);
  document.removeEventListener('mouseup', endDrag);
}

/* ========== RENDER TOOLS ========== */
function renderTools(filter){
  filter = filter || '';
  const box = document.getElementById('tab-tools');
  const f = filter.toLowerCase().trim();
  let html = '<input type="text" class="search-box" id="tool-search" placeholder="🔎 Buscar elementos..." value="' + f.replace(/"/g,'&quot;') + '">';
  let found = false;
  LIB.forEach((cat, ci) => {
    const items = cat.items.filter(it => !f || it.label.toLowerCase().includes(f) || it.type.toLowerCase().includes(f));
    if(!items.length) return;
    found = true;
    html += '<div class="tool-cat"><div class="tool-cat-title">' + cat.cat + '</div><div class="tool-grid">';
    cat.items.forEach((it, ii) => {
      if(f && !it.label.toLowerCase().includes(f) && !it.type.toLowerCase().includes(f)) return;
      const iconClass = it.icon.startsWith('fa-brands') ? it.icon : 'fa-solid ' + it.icon;
      html += '<div class="draggable" draggable="true" data-cat="' + ci + '" data-idx="' + ii + '">' +
        '<i class="' + iconClass + '"></i><span>' + it.label + '</span></div>';
    });
    html += '</div></div>';
  });
  if(!found) html += '<div class="empty-msg"><i class="fa-solid fa-magnifying-glass"></i>Sin resultados</div>';
  box.innerHTML = html;

  box.querySelectorAll('.draggable').forEach(el => {
    el.addEventListener('dragstart', e => {
      e.dataTransfer.setData('text/plain', JSON.stringify({ cat:parseInt(el.dataset.cat), idx:parseInt(el.dataset.idx) }));
    });
  });
  const s = box.querySelector('#tool-search');
  s.addEventListener('input', e => renderTools(e.target.value));
  s.addEventListener('mousedown', e => e.stopPropagation());
}

/* ========== DROP EN CANVAS ========== */
canvasWrap.addEventListener('dragover', e => {
  e.preventDefault();
  e.dataTransfer.dropEffect = 'copy';
  canvasWrap.classList.add('drag-over');
});
canvasWrap.addEventListener('dragleave', e => {
  if(!canvasWrap.contains(e.relatedTarget)) canvasWrap.classList.remove('drag-over');
});
canvasWrap.addEventListener('drop', e => {
  e.preventDefault();
  e.stopPropagation();
  canvasWrap.classList.remove('drag-over');
  const data = e.dataTransfer.getData('text/plain');
  if(!data) return;
  try {
    const o = JSON.parse(data);
    const item = LIB[o.cat].items[o.idx];
    const rect = canvas.getBoundingClientRect();
    const x = e.clientX - rect.left;
    const y = e.clientY - rect.top;
    const p = defaults(item.type);
    const w = typeof p.width === 'number' ? p.width : 300;
    const h = typeof p.height === 'number' ? p.height : 80;
    addElement(item.type, Math.max(0,x-w/2), Math.max(0,y-h/2), item.props || {});
  } catch(err){ console.error(err); }
});

/* ========== TABS ========== */
function switchTab(id){
  tabBtns.forEach(b => b.classList.toggle('active', b.dataset.tab === id));
  Object.keys(tabContents).forEach(k => tabContents[k].classList.toggle('hidden', k !== id));
}
tabBtns.forEach(b => b.addEventListener('click', () => switchTab(b.dataset.tab)));

/* ========== PÁGINAS ========== */
function renderPages(){
  const list = document.getElementById('pages-list');
  list.innerHTML = '';
  state.pages.forEach(p => {
    const item = document.createElement('div');
    item.className = 'page-item' + (p.id === state.currentPageId ? ' active' : '');
    item.innerHTML = '<span style="flex:1">' + esc(p.title) + '</span><div class="actions">' +
      '<button data-act="rename" data-id="' + p.id + '"><i class="fa-solid fa-pen"></i></button>' +
      (state.pages.length > 1 ? '<button data-act="delete" data-id="' + p.id + '"><i class="fa-solid fa-trash"></i></button>' : '') +
      '</div>';
    item.querySelector('span').onclick = () => {
      state.currentPageId = p.id;
      clearSel();
      renderAll();
      renderPages();
    };
    item.querySelectorAll('button').forEach(b => {
      b.onclick = ev => {
        ev.stopPropagation();
        if(b.dataset.act === 'rename'){
          const n = prompt('Nuevo nombre:', p.title);
          if(n && n.trim()){ p.title = n.trim(); p.slug = slugify(n.trim()); saveHistory(); renderPages(); }
        } else if(b.dataset.act === 'delete'){
          if(!confirm('¿Eliminar la página "' + p.title + '"?')) return;
          state.pages = state.pages.filter(x => x.id !== p.id);
          if(state.currentPageId === p.id) state.currentPageId = state.pages[0].id;
          clearSel(); saveHistory(); renderAll(); renderPages();
        }
      };
    });
    list.appendChild(item);
  });
}
document.getElementById('btn-add-page').onclick = () => {
  const n = prompt('Nombre de la nueva página:', 'Nueva Página');
  if(!n || !n.trim()) return;
  const id = 'p_' + Math.random().toString(36).substr(2,6);
  state.pages.push({ id, title:n.trim(), slug:slugify(n.trim()), elements:[] });
  state.currentPageId = id;
  clearSel(); saveHistory(); renderAll(); renderPages();
};

/* ========== PANEL PROPIEDADES ========== */
const upd = (k, v) => updateElement(state.selectedId, { [k]: v });

function renderProps(){

    noSel.classList.remove('hidden');
    propsPanel.classList.add('hidden');
    return;
  }
  const el = getElements().find(e => e.id === state.selectedId);
  if(!el){
    noSel.classList.remove('hidden');
    propsPanel.classList.add('hidden');
    return;
  }
  noSel.classList.add('hidden');
  propsPanel.classList.remove('hidden');
  propsPanel.innerHTML = '';

  propsPanel.appendChild(secH('Posición y Tamaño'));
  propsPanel.appendChild(row([
    inp('number','X', el.x, v => upd('x', parseFloat(v))),
    inp('number','Y', el.y, v => upd('y', parseFloat(v)))
  ]));
  propsPanel.appendChild(row([
    inp('number','Ancho', el.width, v => upd('width', parseFloat(v))),
    inp('number','Alto', el.height, v => upd('height', parseFloat(v)))
  ]));

  propsPanel.appendChild(secH('Apariencia'));
  propsPanel.appendChild(row([
    colInp('Fondo', el.bgColor || 'transparent', v => upd('bgColor', v)),
    inp('number','Radio', el.borderRadius || 0, v => upd('borderRadius', parseFloat(v)))
  ]));
  propsPanel.appendChild(inp('text','Borde', el.border || 'none', v => upd('border', v)));
  propsPanel.appendChild(inp('text','Sombra', el.boxShadow || 'none', v => upd('boxShadow', v)));
  propsPanel.appendChild(row([
    inp('number','Opacidad', el.opacity, v => upd('opacity', parseFloat(v))),
    inp('number','z-index', el.zIndex, v => upd('zIndex', parseInt(v)))
  ]));

  const T = el.type;
  if(T === 'heading'){
    propsPanel.appendChild(secH('Título'));
    propsPanel.appendChild(inp('text','Texto', el.text, v => upd('text', v)));
    propsPanel.appendChild(sel('Nivel', el.level, [1,2,3,4,5,6].map(n => ({value:n,label:'H'+n})), v => upd('level', parseInt(v))));
    propsPanel.appendChild(row([
      inp('number','Tamaño', el.fontSize, v => upd('fontSize', parseFloat(v))),
      colInp('Color', el.color, v => upd('color', v))
    ]));
    propsPanel.appendChild(sel('Alineación', el.textAlign, [
      {value:'left',label:'Izquierda'},{value:'center',label:'Centro'},{value:'right',label:'Derecha'}
    ], v => upd('textAlign', v)));
  }
  else if(T === 'paragraph' || T === 'blockquote'){
    propsPanel.appendChild(secH('Texto'));
    propsPanel.appendChild(inp('text','Contenido', el.text, v => upd('text', v)));

function secH(text){
  const h = document.createElement('h4');
  h.className = 'sec-h';
  h.innerText = text;
  return h;
}
function row(cs){
  const d = document.createElement('div');
  d.className = 'crow';
  cs.forEach(c => d.appendChild(c));
  return d;
}
function inp(type, label, value, onChange){
  const w = document.createElement('div');
  w.className = 'cg';
  w.style.flex = '1';
  w.innerHTML = '<label class="cl">' + label + '</label>';
  const i = document.createElement('input');
  i.type = type;
  i.value = value !== undefined ? value : '';
  i.className = 'ci';
  i.onchange = e => { onChange(e.target.value); saveHistory(); };
  w.appendChild(i);
  return w;
}
function textar(label, value, onChange){
  const w = document.createElement('div');
  w.className = 'cg';
  w.innerHTML = '<label class="cl">' + label + '</label>';
  const t = document.createElement('textarea');
  t.value = value !== undefined ? value : '';
  t.className = 'ci';
  t.rows = 4;
  t.onchange = e => { onChange(e.target.value); saveHistory(); };
  w.appendChild(t);
  return w;
}
function colInp(label, value, onChange){
  const safe = (typeof value === 'string') ? value : 'transparent';
  const w = document.createElement('div');
  w.className = 'cg';
  w.style.flex = '1';
  w.innerHTML = '<label class="cl">' + label + '</label>';
  const flex = document.createElement('div');
  flex.style.cssText = 'display:flex;gap:8px;align-items:center';
  const cp = document.createElement('input');
  cp.type = 'color';
  cp.value = safe.startsWith('#') ? safe.substring(0,7) : '#ffffff';
  cp.style.cssText = 'width:28px;height:28px;padding:0;border:none;border-radius:4px;cursor:pointer;background:transparent';
  const ti = document.createElement('input');
  ti.type = 'text';
  ti.value = safe;
  ti.className = 'ci';
  ti.style.flex = '1';
  cp.oninput = e => { ti.value = e.target.value; onChange(e.target.value); };
  cp.onchange = () => saveHistory();
  ti.onchange = e => { cp.value = e.target.value.startsWith('#') ? e.target.value : '#ffffff'; onChange(e.target.value); saveHistory(); };
  flex.appendChild(cp); flex.appendChild(ti);
  w.appendChild(flex);
  return w;
}
function sel(label, value, options, onChange){
  const w = document.createElement('div');
  w.className = 'cg';
  w.innerHTML = '<label class="cl">' + label + '</label>';
  const s = document.createElement('select');
  s.className = 'ci';
  options.forEach(opt => {
    const o = document.createElement('option');
    o.value = opt.value;
    o.innerText = opt.label;
    if(String(opt.value) === String(value)) o.selected = true;
    s.appendChild(o);
  });
  s.onchange = e => { onChange(e.target.value); saveHistory(); };
  w.appendChild(s);
  return w;
}
function chk(label, checked, onChange){
  const w = document.createElement('div');
  w.className = 'chk-row';
  w.innerHTML = '<label>' + label + '</label>';
  const i = document.createElement('input');
  i.type = 'checkbox';
  i.checked = !!checked;
  i.onchange = e => { onChange(e.target.checked); saveHistory(); };
  w.appendChild(i);
  return w;
}

      else if(T==='details') o.push('<details class="elemento e-details" style="'+st+'"><summary>'+esc(el.summary)+'</summary><div class="details-content">'+el.content+'</div></details>');
      else if(T==='alert'){
        const ic = { info:'fa-circle-info', success:'fa-circle-check', warning:'fa-triangle-exclamation', danger:'fa-triangle-exclamation' };
        o.push('<div class="elemento e-alert e-alert-'+el.alertType+'" style="'+st+'"><i class="fa-solid '+ic[el.alertType]+'"></i><div>'+esc(el.text)+'</div></div>');
      }
      else if(T==='progress') o.push('<div class="elemento e-progress" style="'+st+'"><div class="e-progress-bar" style="width:'+(el.value/el.max*100)+'%">'+(el.showLabel?el.value+'%':'')+'</div></div>');
      else if(T==='counter') o.push('<div class="elemento" style="'+st+'"><div class="e-counter">'+el.value+'</div><div style="text-align:center;color:#6b7280;font-size:14px;margin-top:4px">'+esc(el.label)+'</div></div>');
      else if(T==='table'){
        let t = '<table class="elemento e-table" style="'+st+'">';
        el.rows.forEach((r,i) => {
          const tag = (i===0 && el.header) ? 'th' : 'td';
          t += '<tr>'+r.map(c=>'<'+tag+'>'+esc(c)+'</'+tag+'>').join('')+'</tr>';
        });
        t += '</table>';
        o.push(t);
      }
      else if(T==='card') o.push('<div class="elemento e-card" style="'+st+'"><img src="'+el.img+'" alt=""><div class="card-body"><h3 class="card-title">'+esc(el.title)+'</h3><p class="card-text">'+esc(el.text)+'</p><a href="'+(el.buttonHref||'#')+'" class="e-btn" style="background:#3b82f6;color:#fff;font-size:13px;padding:8px 14px">'+esc(el.buttonText)+'</a></div></div>');
      else if(T==='divider') o.push('<hr class="elemento e-divider" style="'+st+'border-top-color:'+el.color+'">');
      else if(T==='icon'){
        const ih = '<i class="fa-solid '+el.icon+'" style="font-size:'+el.size+'px;color:'+el.color+'"></i>';
        o.push(el.href ? '<a class="elemento" href="'+el.href+'" style="'+st+'color:inherit">'+ih+'</a>' : '<div class="elemento" style="'+st+'">'+ih+'</div>');
      }
      else if(T==='social') o.push('<a class="elemento" href="'+el.url+'" target="_blank" style="'+st+'display:flex;align-items:center;justify-content:center;border-radius:'+(el.shape==='circle'?'50%':'8px')+';background:'+el.color+';color:#fff;text-decoration:none"><i class="'+el.icon+'" style="font-size:'+el.size+'px"></i></a>');
    });
    o.push('</div>\n</body>\n</html>');
    return o.join('\n');
  };
  state.pages.forEach((page, i) => {
    setTimeout(() => {
      const html = buildHTML(page);
      const blob = new Blob([html], { type:'text/html' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = i === 0 ? 'index.html' : page.slug + '.html';
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      URL.revokeObjectURL(url);
    }, i * 250);
  });
};

/* ========== INIT ========== */
renderTools();
renderPages();
</script>
</body>
</html>
